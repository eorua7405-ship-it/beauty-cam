<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>필름 카메라</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #101014;
    --glass: rgba(16,16,20,0.78);
    --glass-line: rgba(255,255,255,0.10);
    --text: #f2f0f4;
    --text-dim: #b3b0bd;
    --accent: #ff8fab;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #000; color: var(--text); font-family: "Noto Sans KR", system-ui, sans-serif; }

  .screen { position: fixed; inset: 0; display: none; }
  .screen.on { display: block; }

  canvas.frame {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
  }

  /* ===== 시작 화면 ===== */
  .placeholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; text-align: center; padding: 24px;
    background: var(--bg);
  }
  .placeholder h1 { font-size: 22px; font-weight: 700; }
  .placeholder h1 .dot { color: var(--accent); }
  .placeholder p { font-size: 14px; color: var(--text-dim); line-height: 1.7; }
  .placeholder .lens {
    width: 76px; height: 76px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
  }
  .placeholder .lens::after {
    content: ""; width: 32px; height: 32px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #4a4a5a, #17171d 70%);
  }
  #startBtn {
    background: var(--accent); color: #26101a;
    border: none; font-family: inherit;
    font-size: 15px; font-weight: 700;
    padding: 13px 30px; border-radius: 999px; cursor: pointer;
  }

  /* ===== 공통 오버레이 요소 ===== */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 14px 10px;
    display: flex; align-items: center; gap: 8px; z-index: 10;
  }
  .status {
    background: var(--glass); backdrop-filter: blur(8px);
    border: 1px solid var(--glass-line);
    font-size: 12px; color: var(--text-dim);
    padding: 6px 12px; border-radius: 999px;
    display: flex; align-items: center; gap: 6px;
    margin-right: auto;
  }
  .status .led { width: 7px; height: 7px; border-radius: 50%; background: #666; }
  .status.tracking .led { background: #6ee7a0; }
  .status.tracking { color: #cfeee0; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--glass); backdrop-filter: blur(8px);
    border: 1px solid var(--glass-line);
    color: var(--text); font-size: 17px; font-family: inherit;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .icon-btn.active { background: var(--accent); color: #26101a; border-color: var(--accent); }

  .bottom {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    z-index: 10;
  }

  .filmbar { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .pillrow.sliderrow { align-items: center; gap: 10px; padding: 8px 16px; width: min(88vw, 340px); }
  .slabel { font-size: 12px; font-weight: 500; color: var(--text-dim); flex: 0 0 auto; }
  .sval { font-size: 12px; color: var(--accent); flex: 0 0 28px; text-align: right; }
  .pillrow.sliderrow input[type="range"] { flex: 1; }
  .pillrow {
    display: flex; gap: 6px;
    background: var(--glass); backdrop-filter: blur(8px);
    border: 1px solid var(--glass-line);
    border-radius: 999px; padding: 4px;
  }
  .pill {
    border: none; background: transparent;
    color: var(--text-dim); font-family: inherit;
    font-size: 12px; font-weight: 500;
    padding: 8px 13px; border-radius: 999px; cursor: pointer;
  }
  .pill.on { background: var(--accent); color: #26101a; font-weight: 700; }

  #shotBtn {
    width: 72px; height: 72px; border-radius: 50%;
    background: rgba(255,255,255,0.14);
    border: 4px solid #fff; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #shotBtn::after { content:""; width: 54px; height: 54px; border-radius: 50%; background: #fff; transition: transform .1s; }
  #shotBtn:active::after { transform: scale(0.85); }
  #shotBtn:disabled { opacity: 0.4; }

  #focusRing {
    position: absolute; width: 64px; height: 64px;
    border: 2px solid #fff; border-radius: 50%;
    transform: translate(-50%,-50%) scale(1.4);
    opacity: 0; pointer-events: none; z-index: 5;
  }
  #focusRing.go { animation: focusAnim 0.7s ease; }
  @keyframes focusAnim {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(1.5); }
    30% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1); }
  }

  #toast {
    position: fixed; left: 50%; top: 18%;
    transform: translateX(-50%);
    background: var(--glass); backdrop-filter: blur(8px);
    border: 1px solid var(--glass-line);
    font-size: 13px; padding: 9px 16px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 60;
  }
  #toast.show { opacity: 1; }

  #screenFlash {
    position: fixed; inset: 0; background: #fff;
    opacity: 0; pointer-events: none;
    transition: opacity .1s; z-index: 100;
  }
  #screenFlash.on { opacity: 1; }

  /* ===== 편집 화면 ===== */
  #editScreen { background: var(--bg); }
  #editScreen .frame-wrap {
    position: absolute; top: 0; left: 0; right: 0; bottom: 46%;
  }
  #editScreen .frame { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); }
  .edit-panel {
    position: absolute; left: 0; right: 0; bottom: 0; height: 45%;
    background: var(--glass); backdrop-filter: blur(12px);
    border-top: 1px solid var(--glass-line);
    border-radius: 18px 18px 0 0;
    padding: 16px 18px calc(env(safe-area-inset-bottom, 0px) + 14px);
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 11px;
  }
  .row { display: flex; align-items: center; gap: 10px; }
  .row label { font-size: 13px; font-weight: 500; flex: 0 0 70px; }
  .row output { font-size: 12px; color: var(--accent); flex: 0 0 34px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type="range"] {
    flex: 1; appearance: none; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.16); cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); border: 3px solid #1a1a21;
  }
  .seg { display: flex; gap: 6px; }
  .seg-btn {
    flex: 1;
    background: rgba(255,255,255,0.08); border: 1px solid var(--glass-line);
    color: var(--text-dim); font-family: inherit;
    font-size: 12px; font-weight: 500;
    padding: 9px 4px; border-radius: 10px; cursor: pointer;
  }
  .seg-btn.on { background: var(--accent); border-color: var(--accent); color: #26101a; font-weight: 700; }
  .edit-actions { display: flex; gap: 10px; margin-top: 4px; }
  .edit-actions button {
    flex: 1; font-family: inherit; font-size: 14px; font-weight: 700;
    padding: 13px; border-radius: 999px; cursor: pointer;
  }
  #saveBtn { background: var(--accent); color: #26101a; border: none; }
  #retakeBtn { background: transparent; color: var(--text); border: 1px solid var(--glass-line); }
</style>
</head>
<body>

<!-- ===== 촬영 화면 ===== -->
<div class="screen on" id="camScreen">
  <div class="placeholder" id="placeholder">
    <div class="lens" aria-hidden="true"></div>
    <h1>필름 카메라<span class="dot">.</span></h1>
    <p>필름 룩으로 찍고, 세부 보정은 찍은 뒤에.<br />모든 처리는 내 기기 안에서만 이루어져요.</p>
    <button id="startBtn">카메라 켜기</button>
  </div>

  <canvas class="frame" id="out" style="display:none"></canvas>

  <div class="topbar" id="camTop" style="display:none">
    <div class="status" id="status"><span class="led"></span><span id="statusText">얼굴 찾는 중…</span></div>
    <button class="icon-btn active" id="flashBtn" title="화면 플래시">⚡</button>
    <button class="icon-btn" id="flipBtn" title="카메라 전환">↺</button>
  </div>

  <div id="focusRing" aria-hidden="true"></div>

  <div class="bottom" id="camBottom" style="display:none">
    <!-- 보정 ON/OFF -->
    <div class="pillrow" role="group" aria-label="보정">
      <button class="pill on" id="tgSkin">피부결</button>
      <button class="pill on" id="tgBlemish">잡티</button>
      <button class="pill on" id="tgContour">윤곽</button>
      <button class="pill on" id="tgFilm">필름</button>
    </div>
    <!-- 필름 프리셋 + 세기 (필름 ON일 때만 표시) -->
    <div class="filmbar" id="filmBar">
      <div class="pillrow" id="filmPresets" role="group" aria-label="필름 프리셋">
        <button class="pill on" data-fp="0">필름1</button>
        <button class="pill" data-fp="1">필름2</button>
        <button class="pill" data-fp="2">필름3</button>
        <button class="pill" data-fp="3">필름4</button>
      </div>
      <div class="pillrow sliderrow">
        <span class="slabel">세기</span>
        <input type="range" id="filmStrength" min="0" max="100" value="60" />
        <output class="sval" id="filmStrengthVal">60</output>
      </div>
    </div>

    <!-- 셔터스피드 -->
    <div class="pillrow" role="group" aria-label="셔터스피드">
      <button class="pill on" data-ss="auto">SS 오토</button>
      <button class="pill" data-ss="30">1/30</button>
      <button class="pill" data-ss="60">1/60</button>
      <button class="pill" data-ss="125">1/125</button>
      <button class="pill" data-ss="250">1/250</button>
    </div>
    <!-- 화각 -->
    <div class="pillrow" role="group" aria-label="화각">
      <button class="pill on" data-focal="28">28mm</button>
      <button class="pill" data-focal="35">35mm</button>
      <button class="pill" data-focal="50">50mm</button>
    </div>
    <button id="shotBtn" disabled aria-label="사진 찍기"></button>
  </div>
</div>

<!-- ===== 편집 화면 ===== -->
<div class="screen" id="editScreen">
  <div class="frame-wrap"><canvas class="frame" id="editOut"></canvas></div>
  <div class="edit-panel">
    <div class="row"><label for="film">필름 감성</label><input type="range" id="film" min="0" max="100" value="0" /><output id="filmVal">0</output></div>
    <div class="row"><label for="sharp">선명도</label><input type="range" id="sharp" min="0" max="100" value="15" /><output id="sharpVal">15</output></div>
    <div class="row"><label for="contrast">콘트라스트</label><input type="range" id="contrast" min="50" max="150" value="100" /><output id="contrastVal">100</output></div>
    <div class="row"><label for="sat">채도</label><input type="range" id="sat" min="0" max="200" value="100" /><output id="satVal">100</output></div>
    <div class="seg" role="group" aria-label="화이트 밸런스">
      <button class="seg-btn on" data-wb="auto">오토</button>
      <button class="seg-btn" data-wb="3300">3300K</button>
      <button class="seg-btn" data-wb="4400">4400K</button>
      <button class="seg-btn" data-wb="5600">5600K</button>
    </div>
    <div class="row"><label for="rGain">레드</label><input type="range" id="rGain" min="70" max="130" value="100" /><output id="rGainVal">100</output></div>
    <div class="row"><label for="gGain">그린</label><input type="range" id="gGain" min="70" max="130" value="100" /><output id="gGainVal">100</output></div>
    <div class="row"><label for="bGain">블루</label><input type="range" id="bGain" min="70" max="130" value="100" /><output id="bGainVal">100</output></div>
    <div class="edit-actions">
      <button id="retakeBtn">다시 찍기</button>
      <button id="saveBtn">저장</button>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>
<div id="screenFlash"></div>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const $ = (id) => document.getElementById(id);
const out = $("out"), ctx = out.getContext("2d");
const editOut = $("editOut"), editCtx = editOut.getContext("2d");
const statusEl = $("status"), statusText = $("statusText");
const screenFlash = $("screenFlash"), focusRing = $("focusRing"), toast = $("toast");

let toastTimer = 0;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
}

/* ===== 상태 ===== */
let facing = "user";
let useFlash = true;
let focal = 28, hwZoom = false;
let ssChoice = "auto";
let skinOn = true, blemishOn = true, contourOn = true, filmOn = true;
let filmPreset = 0, filmStrength = 0.6;
let mode = "cam";   // cam | edit
let landmarker = null, lastLandmarks = null;

const video = document.createElement("video");
video.playsInline = true; video.muted = true;

const maskCanvas = document.createElement("canvas");
const maskCtx = maskCanvas.getContext("2d");
const warpCanvas = document.createElement("canvas");   // 윤곽 변위 맵 (실루엣 평탄화 벡터장)
const warpCtx = warpCanvas.getContext("2d");
const capCanvas = document.createElement("canvas");   // 고해상도 촬영 결과 (편집 원본)
const capCtx = capCanvas.getContext("2d");

const FACE_OVAL = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];

/* ===== 편집 슬라이더 ===== */
const SLIDERS = ["film","sharp","contrast","sat","rGain","gGain","bGain"];
const S = {};
for (const id of SLIDERS) {
  S[id] = $(id);
  const val = $(id + "Val");
  S[id].addEventListener("input", () => { val.textContent = S[id].value; if (mode === "edit") editRender(); });
}
const WB_MAP = { auto: 0.0, "3300": -1.0, "4400": 0.35, "5600": 1.0 };
let wbValue = 0.0;
document.querySelector("#editScreen .seg").addEventListener("click", (e) => {
  const btn = e.target.closest(".seg-btn");
  if (!btn) return;
  document.querySelectorAll("#editScreen .seg-btn").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  wbValue = WB_MAP[btn.dataset.wb];
  editRender();
});

/* ===== 촬영 화면 컨트롤 ===== */
$("tgSkin").addEventListener("click", (e) => { skinOn = !skinOn; e.target.classList.toggle("on", skinOn); });
$("tgBlemish").addEventListener("click", (e) => { blemishOn = !blemishOn; e.target.classList.toggle("on", blemishOn); });
$("tgContour").addEventListener("click", (e) => { contourOn = !contourOn; e.target.classList.toggle("on", contourOn); });
$("tgFilm").addEventListener("click", (e) => {
  filmOn = !filmOn;
  e.target.classList.toggle("on", filmOn);
  $("filmBar").style.display = filmOn ? "flex" : "none";
});
$("filmPresets").addEventListener("click", (e) => {
  const btn = e.target.closest(".pill");
  if (!btn) return;
  document.querySelectorAll("#filmPresets .pill").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  filmPreset = Number(btn.dataset.fp);
});
$("filmStrength").addEventListener("input", (e) => {
  filmStrength = e.target.value / 100;
  $("filmStrengthVal").textContent = e.target.value;
});

document.querySelector('[aria-label="셔터스피드"]').addEventListener("click", (e) => {
  const btn = e.target.closest(".pill");
  if (!btn) return;
  e.currentTarget.querySelectorAll(".pill").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  ssChoice = btn.dataset.ss;
  applyShutter();
});

document.querySelector('[aria-label="화각"]').addEventListener("click", (e) => {
  const btn = e.target.closest(".pill");
  if (!btn) return;
  e.currentTarget.querySelectorAll(".pill").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  focal = Number(btn.dataset.focal);
  applyFocal();
});

$("flashBtn").addEventListener("click", (e) => {
  useFlash = !useFlash;
  e.currentTarget.classList.toggle("active", useFlash);
});

/* ===== 카메라 하드웨어 제어 ===== */
function track() { return video.srcObject?.getVideoTracks()[0]; }

async function applyFocal() {
  hwZoom = false;
  const t = track(); const caps = t?.getCapabilities?.();
  if (caps && caps.zoom) {
    const z = Math.min(caps.zoom.max, Math.max(caps.zoom.min, caps.zoom.min * (focal / 28)));
    try { await t.applyConstraints({ advanced: [{ zoom: z }] }); hwZoom = true; } catch {}
  }
}

async function applyShutter() {
  const t = track(); const caps = t?.getCapabilities?.();
  if (ssChoice === "auto") {
    if (caps?.exposureMode?.includes("continuous"))
      t.applyConstraints({ advanced: [{ exposureMode: "continuous" }] }).catch(() => {});
    return;
  }
  if (caps?.exposureTime && caps.exposureMode?.includes("manual")) {
    // exposureTime 단위: 100마이크로초. 1/60초 = 10000/60
    const want = 10000 / Number(ssChoice);
    const v = Math.min(caps.exposureTime.max, Math.max(caps.exposureTime.min, want));
    try {
      await t.applyConstraints({ advanced: [{ exposureMode: "manual", exposureTime: v }] });
    } catch { showToast("이 기기는 수동 셔터를 지원하지 않아요"); }
  } else {
    showToast("이 기기는 수동 셔터를 지원하지 않아요 (오토 유지)");
  }
}

function tryFocus(m) {
  const t = track();
  if (!t?.getCapabilities) return;
  const caps = t.getCapabilities();
  if (!caps.focusMode) return;
  const mm = caps.focusMode.includes(m) ? m : caps.focusMode.includes("continuous") ? "continuous" : null;
  if (mm) t.applyConstraints({ advanced: [{ focusMode: mm }] }).catch(() => {});
}

/* ===== WebGL 파이프라인 ===== */
const glCanvas = document.createElement("canvas");
const gl = glCanvas.getContext("webgl", { premultipliedAlpha: false, preserveDrawingBuffer: true });
let glReady = false, glOK = false, uLoc = {};

const VS = `
attribute vec2 aPos; varying vec2 vUV;
void main() { vUV = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

const FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 vUV;
uniform sampler2D uFrame;
uniform sampler2D uMask;
uniform vec2  uTexel;      // 소스 1픽셀 크기
uniform float uAspect;     // 세로/가로 비율
uniform float uRadius;
uniform float uSmooth;
uniform float uBlemish;
uniform float uFilm;
uniform float uSharp;
uniform float uContrast;
uniform float uSat;
uniform vec3  uRGB;
uniform float uWB;
uniform float uTime;
uniform vec2  uFmTone;     // 필름 톤커브 (스케일, 리프트)
uniform float uFmSat;      // 필름 채도 감쇄
uniform vec3  uFmHi;       // 하이라이트 틴트
uniform vec3  uFmSh;       // 섀도 틴트
uniform float uFmGrain;    // 그레인 세기
uniform float uFmVig;      // 비네트 세기
uniform float uLens;       // 화각별 렌즈 왜곡 (28mm 배럴 ~ 50mm 평탄)
uniform sampler2D uWarp;   // 윤곽 변위 맵 (실루엣 평탄화 벡터, RG 인코딩)
uniform float uWarpAmt;    // 윤곽 보정 on/off

void main() {
  vec2 uv = vUV;

  // ===== 윤곽 보정: 실루엣의 튀어나온 부분(광대 모서리·각진 턱)을 평탄화 =====
  // JS에서 계산한 변위 맵을 샘플. 튀어나온 지점만 매끈한 기준선 쪽으로 당겨진다.
  if (uWarpAmt > 0.5) {
    vec2 wv = texture2D(uWarp, vUV).rg;
    uv -= (wv - vec2(128.0 / 255.0)) * 0.08;
  }

  // ===== 화각 렌즈 느낌: 28mm 배럴 왜곡(가장자리 볼록) ~ 50mm 평탄 =====
  if (abs(uLens) > 0.001) {
    vec2 cc = uv - 0.5; cc.y *= uAspect;
    float r2 = dot(cc, cc);
    vec2 cd = cc * (1.0 + uLens * r2);
    cd.y /= uAspect;
    uv = 0.5 + cd;
  }

  vec3 c = texture2D(uFrame, uv).rgb;
  vec3 res = c;
  float m = texture2D(uMask, uv).a;

  // ===== 피부 보정 (얼굴 마스크 안에서만) =====
  if (m > 0.01 && (uSmooth > 0.01 || uBlemish > 0.01)) {
    float sigmaR = 0.07 + 0.07 * uSmooth;
    vec3 sum = c; float wsum = 1.0; vec3 plain = c;
    for (int i = 0; i < 16; i++) {
      float ang = 0.3926991 * float(i);
      float ring = (mod(float(i), 2.0) < 1.0) ? 1.0 : 0.55;
      vec2 off = vec2(cos(ang), sin(ang)) * uRadius * ring * uTexel;
      vec3 s = texture2D(uFrame, uv + off).rgb;
      float d = length(s - c);
      float wr = exp(-(d * d) / (2.0 * sigmaR * sigmaR));
      sum += s * wr; wsum += wr; plain += s;
    }
    vec3 base = sum / wsum;
    vec3 avg = plain / 17.0;
    vec3 hi = c - base;

    float darker = avg.g - c.g;
    float th = 0.045 - 0.018 * uBlemish;
    float spot = smoothstep(th * 0.5, th, darker);
    spot *= 1.0 - smoothstep(0.09, 0.18, darker);
    spot *= smoothstep(0.12, 0.28, c.g);
    spot *= 1.0 - 0.5 * smoothstep(0.65, 0.85, avg.g);
    spot *= 0.70 * uBlemish;

    float brighter = c.g - avg.g;
    float glare = smoothstep(th * 0.5, th, brighter);
    glare *= 0.60 * uBlemish;

    // --- 마이크로 닷지 & 번: 색을 덮지 않고 '명암'만 주변과 맞춰 잡티를 지움 ---
    // 잡티가 보이는 원인은 주변과의 명암 차이. 곱셈 비율로 밝기만 맞추면
    // 모공·피부 결 같은 질감은 비율 그대로 살아남는다 (Evoto 방식)
    vec3 lw = vec3(0.299, 0.587, 0.114);
    float lumC = dot(c, lw);
    float lumA = dot(avg, lw);
    // 조정폭 ±15% 제한: 미세 음영들이 일제히 밝아져 얼굴이 창백해지는 것을 방지
    float ratio = clamp(lumA / max(lumC, 0.02), 0.85, 1.15);
    float dnb = mix(1.0, ratio, max(spot, glare));   // 어두우면 Dodge, 밝으면 Burn
    vec3 r = c * dnb;
    // 붉은 자국 같은 '색 얼룩'은 색조만 살짝 주변으로 (밝기·질감은 유지)
    vec3 toneMatch = avg * (dot(r, lw) / max(lumA, 0.02));
    r = mix(r, toneMatch, spot * 0.35);

    // --- 주파수 분리 스무딩: 저주파(톤) 층만 부드럽게, 고주파(모공·결)는 잠금 ---
    float dev = abs(avg.g - c.g);
    float structural = smoothstep(0.035, 0.11, dev);
    vec3 lowNew = mix(base, avg, uSmooth * 0.75 * (1.0 - structural)); // 톤 레이어만 섞음
    vec3 hiKeep = r - base;                                            // 질감 레이어 (닷지앤번 반영됨)
    r = lowNew + hiKeep * 0.86;                                        // 질감 86% 보존

    res = mix(c, r, m);
  }


  // ===== 선명도 =====
  if (uSharp > 0.001) {
    vec3 nb = texture2D(uFrame, uv + vec2(uTexel.x, 0.0)).rgb
            + texture2D(uFrame, uv - vec2(uTexel.x, 0.0)).rgb
            + texture2D(uFrame, uv + vec2(0.0, uTexel.y)).rgb
            + texture2D(uFrame, uv - vec2(0.0, uTexel.y)).rgb;
    res += (c - nb * 0.25) * uSharp;
  }

  // ===== 화이트 밸런스 / RGB / 콘트라스트 / 채도 =====
  res *= vec3(1.0 + 0.09 * uWB, 1.0 + 0.015 * uWB, 1.0 - 0.09 * uWB);
  res *= uRGB;
  res = (res - 0.5) * uContrast + 0.5;
  res = clamp(res, 0.0, 1.0);
  float sl = dot(res, vec3(0.299, 0.587, 0.114));
  res = mix(vec3(sl), res, uSat);

  // ===== 필름 그레이드: 프리셋 파라미터 기반 (레퍼런스 실측값) =====
  if (uFilm > 0.005) {
    vec3 f = res;
    float fl = dot(f, vec3(0.299, 0.587, 0.114));
    f = f * mix(1.0, uFmTone.x, uFilm) + vec3(uFmTone.y * uFilm);      // 페이드 톤커브
    f = mix(f, vec3(dot(f, vec3(0.299, 0.587, 0.114))), uFmSat * uFilm); // 채도
    float hl = smoothstep(0.55, 0.9, fl);
    f *= mix(vec3(1.0), uFmHi, hl * uFilm);                             // 하이라이트 틴트
    float shd = 1.0 - smoothstep(0.1, 0.45, fl);
    f *= mix(vec3(1.0), uFmSh, shd * uFilm);                            // 섀도 틴트
    vec2 dv = vUV - 0.5;
    f *= 1.0 - dot(dv, dv) * uFmVig * uFilm;                            // 비네트
    float g = fract(sin(dot(gl_FragCoord.xy + vec2(uTime * 617.0), vec2(12.9898, 78.233))) * 43758.5453) - 0.5;
    f += g * uFmGrain * uFilm;                                          // 그레인
    res = f;
  }

  gl_FragColor = vec4(clamp(res, 0.0, 1.0), 1.0);
}`;

function initGLOnce() {
  if (glReady || !gl) return glReady;
  const compile = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; }
    return s;
  };
  const vs = compile(gl.VERTEX_SHADER, VS);
  const fs = compile(gl.FRAGMENT_SHADER, FS);
  if (!vs || !fs) return false;
  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return false;
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, "aPos");
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  const mkTex = (unit) => {
    const t = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    return t;
  };
  mkTex(0); mkTex(1); mkTex(2);
  ["uFrame","uMask","uTexel","uAspect","uRadius","uSmooth","uBlemish","uFilm","uSharp",
   "uContrast","uSat","uRGB","uWB","uTime","uLens",
   "uWarp","uWarpAmt",
   "uFmTone","uFmSat","uFmHi","uFmSh","uFmGrain","uFmVig"]
    .forEach(n => uLoc[n] = gl.getUniformLocation(prog, n));
  gl.uniform1i(uLoc.uFrame, 0);
  gl.uniform1i(uLoc.uMask, 1);
  gl.uniform1i(uLoc.uWarp, 2);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  glReady = true;
  return true;
}

// 화각별 렌즈 왜곡 계수 (28mm = 배럴, 50mm = 살짝 평탄)
const LENS_MAP = { 28: -0.13, 35: 0.0, 50: 0.06 };

// 필름 프리셋 — 레퍼런스 사진들에서 실측한 4가지 계열
const FILM_PRESETS = [
  { name: "필름1", tone: [0.875, 0.045], sat: 0.14, hi: [1.032, 1.0, 0.968], sh: [0.99, 1.0, 0.86], grain: 0.040, vig: 0.22 },  // 크림
  { name: "필름2", tone: [0.830, 0.075], sat: 0.30, hi: [1.020, 1.0, 0.985], sh: [1.00, 1.0, 0.90], grain: 0.030, vig: 0.15 },  // 소프트
  { name: "필름3", tone: [0.900, 0.030], sat: 0.10, hi: [1.050, 1.0, 0.955], sh: [0.97, 1.0, 0.72], grain: 0.055, vig: 0.30 },  // 도쿄
  { name: "필름4", tone: [0.880, 0.060], sat: 0.00, hi: [1.010, 1.0, 0.900], sh: [1.00, 1.0, 1.02], grain: 0.050, vig: 0.25 },  // 35mm
];

// 공통 유니폼 설정 후 1프레임 그리기
function drawGL(srcTex, opt) {
  gl.viewport(0, 0, glCanvas.width, glCanvas.height);
  gl.uniform2f(uLoc.uTexel, 1 / opt.srcW, 1 / opt.srcH);
  gl.uniform1f(uLoc.uAspect, opt.srcH / opt.srcW);
  gl.activeTexture(gl.TEXTURE0);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, srcTex);

  gl.uniform1f(uLoc.uRadius, opt.radius ?? 3);
  gl.uniform1f(uLoc.uSmooth, opt.smooth ?? 0);
  gl.uniform1f(uLoc.uBlemish, opt.blemish ?? 0);
  gl.uniform1f(uLoc.uFilm, opt.film ?? 0);
  gl.uniform1f(uLoc.uSharp, opt.sharp ?? 0);
  gl.uniform1f(uLoc.uContrast, opt.contrast ?? 1);
  gl.uniform1f(uLoc.uSat, opt.sat ?? 1);
  gl.uniform3f(uLoc.uRGB, ...(opt.rgb ?? [1, 1, 1]));
  gl.uniform1f(uLoc.uWB, opt.wb ?? 0);
  gl.uniform1f(uLoc.uTime, opt.time ?? 0.5);
  const fm = opt.fm ?? FILM_PRESETS[0];
  gl.uniform2f(uLoc.uFmTone, fm.tone[0], fm.tone[1]);
  gl.uniform1f(uLoc.uFmSat, fm.sat);
  gl.uniform3f(uLoc.uFmHi, fm.hi[0], fm.hi[1], fm.hi[2]);
  gl.uniform3f(uLoc.uFmSh, fm.sh[0], fm.sh[1], fm.sh[2]);
  gl.uniform1f(uLoc.uFmGrain, fm.grain);
  gl.uniform1f(uLoc.uFmVig, fm.vig);
  gl.uniform1f(uLoc.uLens, opt.lens ?? 0);
  gl.uniform1f(uLoc.uWarpAmt, opt.warp ? 1 : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// 윤곽 변위 맵 계산: 실루엣 36점을 가우시안 스무딩한 '매끈한 기준선'을 만들고,
// 실제 선이 기준선에서 튀어나온 만큼의 40%를 당기는 변위 벡터장을 그린다.
// 옆모습에서는 코 방향 실루엣(콧대·입)은 보호한다.
function computeWarpMap(w, hh) {
  const L = lastLandmarks;
  const n = FACE_OVAL.length;
  const faceW = Math.abs(L[454].x - L[234].x);
  const cx = (L[234].x + L[454].x) / 2;
  const yaw = (L[4].x - cx) / Math.max(faceW, 0.001);
  const noseSign = Math.sign(yaw), yaw01 = Math.min(1, Math.abs(yaw) * 3);

  const P = FACE_OVAL.map(idx => [L[idx].x, L[idx].y]);
  const GW = [1, 4, 8, 12, 14, 12, 8, 4, 1], gsum = 64;   // 스무딩 가중치 (±4점)
  const D = P.map((_, i) => {
    let sx = 0, sy = 0;
    for (let k = -4; k <= 4; k++) {
      const p = P[(i + k + n) % n]; const g = GW[k + 4];
      sx += p[0] * g; sy += p[1] * g;
    }
    sx /= gsum; sy /= gsum;
    const toNose = Math.max(0, Math.min(1, (P[i][0] - cx) * noseSign / faceW * 2));
    const s = 0.40 * (1 - toNose * yaw01);   // 튀어나온 정도의 40%만, 코 방향은 보호
    return [(sx - P[i][0]) * s, (sy - P[i][1]) * s];
  });

  const img = warpCtx.createImageData(w, hh);
  const data = img.data;
  for (let i = 0; i < data.length; i += 4) { data[i] = 128; data[i + 1] = 128; data[i + 3] = 255; }

  const asp = hh / w;                      // 세로 정규화 보정
  const sigma = faceW * 0.09;              // 각 점의 영향 반경
  const acc = new Float32Array(w * hh * 3);
  for (let i = 0; i < n; i++) {
    const px = P[i][0], py = P[i][1], r = sigma * 2.5;
    const x0 = Math.max(0, (px - r) * w | 0), x1 = Math.min(w - 1, Math.ceil((px + r) * w));
    const y0 = Math.max(0, (py - r / asp) * hh | 0), y1 = Math.min(hh - 1, Math.ceil((py + r / asp) * hh));
    for (let y = y0; y <= y1; y++) {
      const ddy = (y / hh - py) * asp;
      for (let x = x0; x <= x1; x++) {
        const ddx = x / w - px;
        const d2 = ddx * ddx + ddy * ddy;
        const wgt = Math.exp(-d2 / (2 * sigma * sigma));
        if (wgt < 0.02) continue;
        const o = (y * w + x) * 3;
        acc[o] += D[i][0] * wgt; acc[o + 1] += D[i][1] * wgt; acc[o + 2] += wgt;
      }
    }
  }
  const K = 0.04;   // 셰이더 디코딩 스케일과 일치 (0.08 = 2K)
  for (let p = 0; p < w * hh; p++) {
    const wsum = acc[p * 3 + 2];
    if (wsum < 0.02) continue;
    const env = Math.min(1, wsum / 0.3);
    const dx = acc[p * 3] / wsum * env;
    const dy = acc[p * 3 + 1] / wsum * env;
    // GL의 uv는 y가 반대이므로 dy 부호 반전해서 저장
    data[p * 4]     = Math.max(0, Math.min(255, 128 + (dx / K) * 127));
    data[p * 4 + 1] = Math.max(0, Math.min(255, 128 + (-dy / K) * 127));
  }
  warpCtx.putImageData(img, 0, 0);
}

/* ===== 촬영 프리뷰 ===== */
const PREVIEW_SCALE = 0.5;   // 미리보기는 절반 해상도 → 발열 절약, 촬영은 원본 해상도

function camPreviewFrame() {
  if (!glOK) return video;
  glCanvas.width = Math.round(video.videoWidth * PREVIEW_SCALE);
  glCanvas.height = Math.round(video.videoHeight * PREVIEW_SCALE);
  buildFaceMaskIfNeeded();
  const faceW = lastLandmarks ? Math.abs(lastLandmarks[454].x - lastLandmarks[234].x) * video.videoWidth : 0;
  drawGL(video, {
    srcW: video.videoWidth, srcH: video.videoHeight,
    radius: Math.max(2.5, faceW * 0.030),
    smooth: (skinOn && lastLandmarks) ? 0.65 : 0,
    blemish: (blemishOn && lastLandmarks) ? 0.60 : 0,
    film: filmOn ? filmStrength : 0,
    fm: FILM_PRESETS[filmPreset],
    lens: LENS_MAP[focal],
    warp: contourOn && !!lastLandmarks,
    time: (performance.now() % 10000) / 10000,
  });
  return glCanvas;
}

/* ===== 고해상도 촬영 → 편집 화면 ===== */
function captureHighRes() {
  // 원본 해상도로 1프레임 처리 (피부·윤곽·렌즈만 굽고, 색·필름은 편집에서)
  glCanvas.width = video.videoWidth;
  glCanvas.height = video.videoHeight;
  const faceW = lastLandmarks ? Math.abs(lastLandmarks[454].x - lastLandmarks[234].x) * video.videoWidth : 0;
  drawGL(video, {
    srcW: video.videoWidth, srcH: video.videoHeight,
    radius: Math.max(2.5, faceW * 0.030),
    smooth: (skinOn && lastLandmarks) ? 0.65 : 0,
    blemish: (blemishOn && lastLandmarks) ? 0.60 : 0,
    lens: LENS_MAP[focal],
    warp: contourOn && !!lastLandmarks,
    film: filmOn ? filmStrength : 0,               // 필름 프리셋을 사진에 직접 굽기
    fm: FILM_PRESETS[filmPreset],
    time: (performance.now() % 10000) / 10000,     // 그레인은 사진에 고정
  });

  // 미러링 + 화각 크롭을 구워서 편집 원본 확정
  const w = video.videoWidth, h = video.videoHeight;
  const cropF = hwZoom ? 1 : 28 / focal;
  const sw = w * cropF, sh = h * cropF;
  const sx = (w - sw) / 2, sy = (h - sh) / 2;
  capCanvas.width = w; capCanvas.height = h;
  capCtx.save();
  if (facing === "user") { capCtx.translate(w, 0); capCtx.scale(-1, 1); }
  capCtx.drawImage(glOK ? glCanvas : video, sx, sy, sw, sh, 0, 0, w, h);
  capCtx.restore();

  enterEdit();
}

function enterEdit() {
  mode = "edit";
  $("camScreen").classList.remove("on");
  $("editScreen").classList.add("on");
  editOut.width = capCanvas.width;
  editOut.height = capCanvas.height;
  editRender();
}

function editRender() {
  if (!glOK) { editCtx.drawImage(capCanvas, 0, 0); return; }
  glCanvas.width = capCanvas.width;
  glCanvas.height = capCanvas.height;
  drawGL(capCanvas, {
    srcW: capCanvas.width, srcH: capCanvas.height,
    film: S.film.value / 100,
    fm: FILM_PRESETS[filmPreset],
    sharp: S.sharp.value / 100 * 1.1,
    contrast: S.contrast.value / 100,
    sat: S.sat.value / 100,
    rgb: [S.rGain.value / 100, S.gGain.value / 100, S.bGain.value / 100],
    wb: wbValue,
  });
  editCtx.drawImage(glCanvas, 0, 0);
}

$("retakeBtn").addEventListener("click", () => {
  mode = "cam";
  $("editScreen").classList.remove("on");
  $("camScreen").classList.add("on");
});

$("saveBtn").addEventListener("click", () => {
  editRender();
  const a = document.createElement("a");
  a.href = editOut.toDataURL("image/png");
  const t = new Date();
  a.download = "film-cam_" + t.getHours() + "시" + t.getMinutes() + "분" + t.getSeconds() + "초.png";
  a.click();
  showToast("저장했어요");
});

/* ===== 카메라 시작 / 전환 ===== */
async function startStream() {
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: 1080 }, height: { ideal: 1440 } },
    audio: false,
  });
  video.srcObject = stream;
  await video.play();
  out.width = Math.round(video.videoWidth * PREVIEW_SCALE);
  out.height = Math.round(video.videoHeight * PREVIEW_SCALE);
  maskCanvas.width = warpCanvas.width = Math.round(video.videoWidth / 5);
  maskCanvas.height = warpCanvas.height = Math.round(video.videoHeight / 5);
  glOK = initGLOnce();
  if (glOK) {
    gl.activeTexture(gl.TEXTURE1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, maskCanvas);
    warpCtx.fillStyle = "rgb(128,128,0)";   // 중립 변위 (이동 없음)
    warpCtx.fillRect(0, 0, warpCanvas.width, warpCanvas.height);
    gl.activeTexture(gl.TEXTURE2);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, warpCanvas);
  }
  lastLandmarks = null; maskDirty = false;
  tryFocus("continuous");
  await applyFocal();
  await applyShutter();
}

$("startBtn").addEventListener("click", async () => {
  const btn = $("startBtn");
  btn.disabled = true; btn.textContent = "준비 중…";
  try {
    const fileset = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    landmarker = await FaceLandmarker.createFromOptions(fileset, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate: "GPU",
      },
      runningMode: "VIDEO", numFaces: 1,
    });
    await startStream();
    if (!glOK) showToast("이 기기는 GPU 처리를 지원하지 않아요");
    $("placeholder").style.display = "none";
    out.style.display = "block";
    $("camTop").style.display = "flex";
    $("camBottom").style.display = "flex";
    $("shotBtn").disabled = false;
    requestAnimationFrame(loop);
  } catch (err) {
    btn.disabled = false; btn.textContent = "카메라 켜기";
    alert("카메라를 켤 수 없어요.\n브라우저의 카메라 권한을 확인해 주세요.\n\n" + err.message);
  }
});

$("flipBtn").addEventListener("click", async () => {
  facing = (facing === "user") ? "environment" : "user";
  try { await startStream(); }
  catch (err) {
    facing = (facing === "user") ? "environment" : "user";
    await startStream().catch(() => {});
    showToast("카메라 전환 실패");
  }
});

/* ===== 탭 초점 ===== */
$("camScreen").addEventListener("click", (e) => {
  if (mode !== "cam" || e.target !== out) return;
  focusRing.style.left = e.clientX + "px";
  focusRing.style.top = e.clientY + "px";
  focusRing.classList.remove("go");
  void focusRing.offsetWidth;
  focusRing.classList.add("go");
  tryFocus("single-shot");
  setTimeout(() => tryFocus("continuous"), 900);
});

/* ===== 메인 루프 ===== */
let frameCount = 0, lastSeen = 0, maskDirty = false, lastRenderTs = 0;

function loop(ts) {
  requestAnimationFrame(loop);
  if (mode !== "cam" || video.readyState < 2) return;
  if (ts - lastRenderTs < 31) return;   // 30fps 상한
  lastRenderTs = ts;

  if (frameCount % 3 === 0) {
    const result = landmarker.detectForVideo(video, performance.now());
    const fresh = result.faceLandmarks?.[0] ?? null;
    if (fresh) { lastLandmarks = fresh; lastSeen = performance.now(); maskDirty = true; }
    else if (performance.now() - lastSeen > 5000) lastLandmarks = null;
  }
  frameCount++;

  statusEl.classList.toggle("tracking", !!lastLandmarks);
  statusText.textContent = lastLandmarks ? "얼굴 인식 중" : "얼굴 찾는 중…";

  // 프리뷰 렌더
  const src = camPreviewFrame();
  const w = out.width, h = out.height;
  const cropF = hwZoom ? 1 : 28 / focal;
  const srcW = src === video ? video.videoWidth : glCanvas.width;
  const srcH = src === video ? video.videoHeight : glCanvas.height;
  const sw = srcW * cropF, sh = srcH * cropF;
  const sx = (srcW - sw) / 2, sy = (srcH - sh) / 2;
  ctx.save();
  if (facing === "user") { ctx.translate(w, 0); ctx.scale(-1, 1); }
  ctx.drawImage(src, sx, sy, sw, sh, 0, 0, w, h);
  ctx.restore();
}

/* ===== 얼굴 마스크 ===== */
function buildFaceMaskIfNeeded() {
  if (!maskDirty || !lastLandmarks) return;
  buildFaceMask(maskCanvas.width, maskCanvas.height);
  gl.activeTexture(gl.TEXTURE1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, maskCanvas);
  if (contourOn) {
    computeWarpMap(warpCanvas.width, warpCanvas.height);
    gl.activeTexture(gl.TEXTURE2);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, warpCanvas);
  }
  maskDirty = false;
}

function buildFaceMask(w, h) {
  maskCtx.clearRect(0, 0, w, h);
  const L = lastLandmarks;
  maskCtx.save();
  maskCtx.filter = "blur(" + w * 0.015 + "px)";
  maskCtx.fillStyle = "#fff";
  maskCtx.beginPath();
  FACE_OVAL.forEach((idx, i) => {
    const p = L[idx];
    i === 0 ? maskCtx.moveTo(p.x * w, p.y * h) : maskCtx.lineTo(p.x * w, p.y * h);
  });
  maskCtx.closePath();
  maskCtx.fill();
  maskCtx.restore();

  const faceW = Math.abs(L[454].x - L[234].x) * w;
  const nTop = L[168], nBot = L[2];
  const ncx = (nTop.x + nBot.x) / 2 * w, ncy = (nTop.y + nBot.y) / 2 * h;
  const ndx = (nBot.x - nTop.x) * w, ndy = (nBot.y - nTop.y) * h;
  const nLen = Math.hypot(ndx, ndy);
  const nAng = Math.atan2(ndy, ndx) - Math.PI / 2;
  maskCtx.save();
  maskCtx.filter = "blur(" + w * 0.01 + "px)";
  maskCtx.fillStyle = "#fff";
  maskCtx.beginPath();
  maskCtx.ellipse(ncx, ncy, faceW * 0.14, nLen * 0.8, nAng, 0, Math.PI * 2);
  maskCtx.fill();
  maskCtx.restore();

  maskCtx.save();
  maskCtx.globalCompositeOperation = "destination-out";
  maskCtx.filter = "blur(" + faceW * 0.02 + "px)";
  maskCtx.fillStyle = "#fff";
  carveEllipse(L[159], L[145], faceW * 0.15, faceW * 0.07, w, h);
  carveEllipse(L[386], L[374], faceW * 0.15, faceW * 0.07, w, h);
  carveEllipse(L[105], L[105], faceW * 0.16, faceW * 0.045, w, h);
  carveEllipse(L[334], L[334], faceW * 0.16, faceW * 0.045, w, h);
  carveEllipse(L[13],  L[14],  faceW * 0.22, faceW * 0.11, w, h);
  maskCtx.restore();
}

function carveEllipse(top, bottom, rx, ry, w, h) {
  const cx = (top.x + bottom.x) / 2 * w;
  const cy = (top.y + bottom.y) / 2 * h;
  maskCtx.beginPath();
  maskCtx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  maskCtx.fill();
}

/* ===== 촬영 ===== */
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

$("shotBtn").addEventListener("click", async () => {
  if (useFlash && facing === "user") {
    screenFlash.classList.add("on");
    await sleep(400);
    captureHighRes();
    await sleep(150);
    screenFlash.classList.remove("on");
  } else {
    captureHighRes();
  }
});
</script>
