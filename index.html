<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>필름 카메라</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #101014;
    --glass: rgba(16,16,20,0.78);
    --glass-line: rgba(255,255,255,0.10);
    --text: #f2f0f4;
    --text-dim: #b3b0bd;
    --accent: #ff8fab;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font-family: "Noto Sans KR", system-ui, sans-serif; }

  /* ===== 전체 화면 뷰파인더 ===== */
  #stage { position: fixed; inset: 0; }
  #out {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: none;
  }
  #stage.live #out { display: block; }
  #stage.live .placeholder { display: none; }

  .placeholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; text-align: center; padding: 24px;
  }
  .placeholder h1 { font-size: 22px; font-weight: 700; }
  .placeholder h1 .dot { color: var(--accent); }
  .placeholder p { font-size: 14px; color: var(--text-dim); line-height: 1.7; }
  .placeholder .lens {
    width: 76px; height: 76px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
  }
  .placeholder .lens::after {
    content: ""; width: 32px; height: 32px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #4a4a5a, #17171d 70%);
  }
  #startBtn {
    background: var(--accent); color: #26101a;
    border: none; font-family: inherit;
    font-size: 15px; font-weight: 700;
    padding: 13px 30px; border-radius: 999px; cursor: pointer;
  }
  #startBtn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* ===== 상단 오버레이 ===== */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 14px 10px;
    display: none; align-items: center; gap: 8px;
    z-index: 10;
  }
  #stage.live .topbar { display: flex; }
  .status {
    background: var(--glass); backdrop-filter: blur(8px);
    border: 1px solid var(--glass-line);
    font-size: 12px; color: var(--text-dim);
    padding: 6px 12px; border-radius: 999px;
    display: flex; align-items: center; gap: 6px;
    margin-right: auto;
  }
  .status .led { width: 7px; height: 7px; border-radius: 50%; background: #666; }
  .status.tracking .led { background: #6ee7a0; }
  .status.tracking { color: #cfeee0; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--glass); backdrop-filter: blur(8px);
    border: 1px solid var(--glass-line);
    color: var(--text); font-size: 17px; font-family: inherit;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .icon-btn.active { background: var(--accent); color: #26101a; border-color: var(--accent); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ===== 초점 링 ===== */
  #focusRing {
    position: absolute; width: 64px; height: 64px;
    border: 2px solid #fff; border-radius: 50%;
    transform: translate(-50%, -50%) scale(1.4);
    opacity: 0; pointer-events: none; z-index: 5;
  }
  #focusRing.go { animation: focusAnim 0.7s ease; }
  @keyframes focusAnim {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(1.5); }
    30% { opacity: 1; transform: translate(-50%,-50%) scale(1.0); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.0); }
  }

  /* ===== 하단 오버레이 ===== */
  .bottom {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    display: none; flex-direction: column; align-items: center; gap: 12px;
    z-index: 10;
  }
  #stage.live .bottom { display: flex; }

  /* 설정 패널 (그룹 버튼 누르면 올라옴) */
  .panel {
    width: min(94vw, 440px);
    background: var(--glass); backdrop-filter: blur(12px);
    border: 1px solid var(--glass-line);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: none; flex-direction: column; gap: 11px;
  }
  .panel.open { display: flex; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row label { font-size: 13px; font-weight: 500; flex: 0 0 70px; }
  .row output { font-size: 12px; color: var(--accent); flex: 0 0 34px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type="range"] {
    flex: 1; appearance: none; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.16); cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); border: 3px solid #1a1a21;
  }
  input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .seg { display: flex; gap: 6px; }
  .seg-btn {
    flex: 1;
    background: rgba(255,255,255,0.08); border: 1px solid var(--glass-line);
    color: var(--text-dim); font-family: inherit;
    font-size: 12px; font-weight: 500;
    padding: 9px 4px; border-radius: 10px; cursor: pointer;
  }
  .seg-btn.on { background: var(--accent); border-color: var(--accent); color: #26101a; font-weight: 700; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; }
  .toggle-row span { font-size: 13px; font-weight: 500; }
  .switch { position: relative; width: 42px; height: 24px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 100%; height: 100%; position: absolute; cursor: pointer; z-index: 1; }
  .switch .track { position: absolute; inset: 0; border-radius: 999px; background: rgba(255,255,255,0.14); transition: background .15s; }
  .switch .track::after { content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--text-dim); transition:all .15s; }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { left: 20px; background: #26101a; }

  /* 그룹 버튼 줄 */
  .dock { display: flex; gap: 8px; }
  .dock-btn {
    background: var(--glass); backdrop-filter: blur(8px);
    border: 1px solid var(--glass-line);
    color: var(--text-dim); font-family: inherit;
    font-size: 13px; font-weight: 500;
    padding: 9px 16px; border-radius: 999px; cursor: pointer;
  }
  .dock-btn.on { background: var(--accent); border-color: var(--accent); color: #26101a; font-weight: 700; }
  .dock-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 셔터 버튼 */
  #shotBtn {
    width: 72px; height: 72px; border-radius: 50%;
    background: rgba(255,255,255,0.14);
    border: 4px solid #fff;
    cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #shotBtn::after {
    content: ""; width: 54px; height: 54px; border-radius: 50%;
    background: #fff; transition: transform 0.1s ease;
  }
  #shotBtn:active::after { transform: scale(0.85); }
  #shotBtn:disabled { opacity: 0.4; }
  #shotBtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  /* 화면 플래시 */
  #screenFlash {
    position: fixed; inset: 0; background: #fff;
    opacity: 0; pointer-events: none;
    transition: opacity 0.1s ease; z-index: 100;
  }
  #screenFlash.on { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    #focusRing.go { animation-duration: 0.01s; }
  }
</style>
</head>
<body>

<div id="stage">
  <div class="placeholder">
    <div class="lens" aria-hidden="true"></div>
    <h1>필름 카메라<span class="dot">.</span></h1>
    <p>필름 룩 · GPU 피부 보정 · 매뉴얼 컨트롤<br />
    모든 처리는 내 기기 안에서만 이루어져요.</p>
    <button id="startBtn">카메라 켜기</button>
  </div>

  <canvas id="out"></canvas>

  <div class="topbar">
    <div class="status" id="status"><span class="led"></span><span id="statusText">얼굴 찾는 중…</span></div>
    <button class="icon-btn active" id="flashBtn" title="화면 플래시" aria-label="화면 플래시 켜짐">⚡</button>
    <button class="icon-btn" id="flipBtn" title="카메라 전환" aria-label="전·후면 카메라 전환">↺</button>
  </div>

  <div id="focusRing" aria-hidden="true"></div>

  <div class="bottom">
    <!-- 설정 패널들 -->
    <div class="panel" data-panel="skin">
      <div class="row"><label for="smooth">부드럽게</label><input type="range" id="smooth" min="0" max="100" value="30" /><output id="smoothVal">30</output></div>
      <div class="row"><label for="blemish">잡티 제거</label><input type="range" id="blemish" min="0" max="100" value="65" /><output id="blemishVal">65</output></div>
      <div class="row"><label for="skinShift">피부 톤</label><input type="range" id="skinShift" min="-50" max="50" value="0" /><output id="skinShiftVal">0</output></div>
      <div class="toggle-row"><span>얼굴 인식 점 보기</span><div class="switch"><input type="checkbox" id="showMesh" /><span class="track"></span></div></div>
    </div>
    <div class="panel" data-panel="look">
      <div class="row"><label for="film">필름 감성</label><input type="range" id="film" min="0" max="100" value="50" /><output id="filmVal">50</output></div>
      <div class="row"><label for="sharp">선명도</label><input type="range" id="sharp" min="0" max="100" value="15" /><output id="sharpVal">15</output></div>
    </div>
    <div class="panel" data-panel="color">
      <div class="row"><label for="contrast">콘트라스트</label><input type="range" id="contrast" min="50" max="150" value="100" /><output id="contrastVal">100</output></div>
      <div class="row"><label for="sat">채도</label><input type="range" id="sat" min="0" max="200" value="100" /><output id="satVal">100</output></div>
      <div class="row"><label for="rGain">레드</label><input type="range" id="rGain" min="70" max="130" value="100" /><output id="rGainVal">100</output></div>
      <div class="row"><label for="gGain">그린</label><input type="range" id="gGain" min="70" max="130" value="100" /><output id="gGainVal">100</output></div>
      <div class="row"><label for="bGain">블루</label><input type="range" id="bGain" min="70" max="130" value="100" /><output id="bGainVal">100</output></div>
    </div>
    <div class="panel" data-panel="wb">
      <div class="seg" role="group" aria-label="화이트 밸런스">
        <button class="seg-btn on" data-wb="auto">오토</button>
        <button class="seg-btn" data-wb="3300">3300K</button>
        <button class="seg-btn" data-wb="4400">4400K</button>
        <button class="seg-btn" data-wb="5600">5600K</button>
      </div>
    </div>

    <!-- 그룹 버튼 -->
    <div class="dock" role="group" aria-label="설정 그룹">
      <button class="dock-btn" data-group="skin">피부</button>
      <button class="dock-btn" data-group="look">룩</button>
      <button class="dock-btn" data-group="color">색</button>
      <button class="dock-btn" data-group="wb">WB</button>
    </div>

    <button id="shotBtn" disabled aria-label="사진 찍기"></button>
  </div>
</div>

<div id="screenFlash"></div>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const $ = (id) => document.getElementById(id);
const stage = $("stage");
const startBtn = $("startBtn");
const out = $("out");
const ctx = out.getContext("2d");
const statusEl = $("status");
const statusText = $("statusText");
const showMeshEl = $("showMesh");
const flashBtn = $("flashBtn");
const flipBtn = $("flipBtn");
const shotBtn = $("shotBtn");
const screenFlash = $("screenFlash");
const focusRing = $("focusRing");

// 슬라이더 자동 연결
const SLIDERS = ["smooth","blemish","skinShift","film","sharp","contrast","sat","rGain","gGain","bGain"];
const S = {};
for (const id of SLIDERS) {
  S[id] = $(id);
  const val = $(id + "Val");
  S[id].addEventListener("input", () => val.textContent = S[id].value);
}

// 설정 패널 열기/닫기
document.querySelector(".dock").addEventListener("click", (e) => {
  const btn = e.target.closest(".dock-btn");
  if (!btn) return;
  const group = btn.dataset.group;
  const wasOn = btn.classList.contains("on");
  document.querySelectorAll(".dock-btn").forEach(b => b.classList.remove("on"));
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("open"));
  if (!wasOn) {
    btn.classList.add("on");
    document.querySelector('.panel[data-panel="' + group + '"]').classList.add("open");
  }
});

// 화이트 밸런스
const WB_MAP = { auto: 0.0, "3300": -1.0, "4400": 0.35, "5600": 1.0 };
let wbValue = 0.0;
document.querySelector('.panel[data-panel="wb"]').addEventListener("click", (e) => {
  const btn = e.target.closest(".seg-btn");
  if (!btn) return;
  document.querySelectorAll(".seg-btn").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  wbValue = WB_MAP[btn.dataset.wb];
});

// 화면 플래시 토글
let useFlash = true;
flashBtn.addEventListener("click", () => {
  useFlash = !useFlash;
  flashBtn.classList.toggle("active", useFlash);
  flashBtn.setAttribute("aria-label", useFlash ? "화면 플래시 켜짐" : "화면 플래시 꺼짐");
});

const video = document.createElement("video");
video.playsInline = true; video.muted = true;

const maskCanvas = document.createElement("canvas");
const maskCtx = maskCanvas.getContext("2d");

const FACE_OVAL = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];

let landmarker = null;
let lastLandmarks = null;
let facing = "user";   // user = 전면(미러링), environment = 후면

/* ===== WebGL 파이프라인 ===== */
const glCanvas = document.createElement("canvas");
const gl = glCanvas.getContext("webgl", { premultipliedAlpha: false });
let glReady = false, glOK = false, uLoc = {};

const VS = `
attribute vec2 aPos;
varying vec2 vUV;
void main() { vUV = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

const FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 vUV;
uniform sampler2D uFrame;
uniform sampler2D uMask;
uniform vec2  uTexel;
uniform float uRadius;
uniform float uSmooth;
uniform float uBlemish;
uniform float uSkinShift;
uniform float uFilm;
uniform float uSharp;
uniform float uContrast;
uniform float uSat;
uniform vec3  uRGB;
uniform float uWB;
uniform float uTime;

void main() {
  vec3 c = texture2D(uFrame, vUV).rgb;
  vec3 res = c;
  float m = texture2D(uMask, vUV).a;

  // ===== 1. 피부 보정 (얼굴 마스크 안에서만) =====
  if (m > 0.01 && (uSmooth > 0.01 || uBlemish > 0.01)) {
    float sigmaR = 0.07 + 0.07 * uSmooth;
    vec3 sum = c; float wsum = 1.0; vec3 plain = c;
    for (int i = 0; i < 16; i++) {
      float ang = 0.3926991 * float(i);
      float ring = (mod(float(i), 2.0) < 1.0) ? 1.0 : 0.55;
      vec2 off = vec2(cos(ang), sin(ang)) * uRadius * ring * uTexel;
      vec3 s = texture2D(uFrame, vUV + off).rgb;
      float d = length(s - c);
      float wr = exp(-(d * d) / (2.0 * sigmaR * sigmaR));
      sum += s * wr; wsum += wr; plain += s;
    }
    vec3 base = sum / wsum;
    vec3 avg = plain / 17.0;
    vec3 hi = c - base;

    // 윤곽선(엣지) 보호 — 코 라인·턱선처럼 '방향성 있는 경계'는 잡티가 아님.
    // 잡티는 사방이 균일한 점이고 윤곽선은 한 방향으로 흐르는 선이므로,
    // 상하좌우 기울기를 재서 기울기가 큰 곳은 잡티 처리에서 제외한다.
    float gx = dot(texture2D(uFrame, vUV + vec2(uTexel.x * 2.0, 0.0)).rgb
                 - texture2D(uFrame, vUV - vec2(uTexel.x * 2.0, 0.0)).rgb, vec3(0.3333));
    float gy = dot(texture2D(uFrame, vUV + vec2(0.0, uTexel.y * 2.0)).rgb
                 - texture2D(uFrame, vUV - vec2(0.0, uTexel.y * 2.0)).rgb, vec3(0.3333));
    float edge = smoothstep(0.025, 0.09, length(vec2(gx, gy)));

    // 잡티: '적당히' 어두운 점만 (그림자·콧구멍·윤곽선은 보호)
    float darker = avg.g - c.g;
    float th = 0.045 - 0.018 * uBlemish;
    float spot = smoothstep(th * 0.5, th, darker);
    spot *= 1.0 - smoothstep(0.09, 0.18, darker);
    spot *= smoothstep(0.12, 0.28, c.g);
    spot *= 1.0 - 0.5 * smoothstep(0.65, 0.85, avg.g);
    spot *= 1.0 - edge;
    spot *= 0.85 * uBlemish;

    float brighter = c.g - avg.g;
    float glare = smoothstep(th * 0.5, th, brighter);
    glare *= 1.0 - edge;
    glare *= 0.7 * uBlemish;

    vec3 r = mix(c, avg, spot);
    r = mix(r, avg, glare);

    // 구조 보호 스무딩 — 음영·윤곽 라인은 건드리지 않음
    float dev = abs(avg.g - c.g);
    float structural = max(smoothstep(0.035, 0.11, dev), edge);
    r = mix(r, base, uSmooth * 0.45 * (1.0 - structural));
    r += hi * 0.20 * (1.0 - max(spot, glare));

    res = mix(c, r, m);
  }

  // ===== 2. 피부 톤 (마스크 안에서만: - 차갑게 / + 따뜻하게) =====
  res.r += uSkinShift * 0.05 * m;
  res.b -= uSkinShift * 0.04 * m;

  // ===== 3. 선명도 (언샤프 마스크) =====
  if (uSharp > 0.001) {
    vec3 nb = texture2D(uFrame, vUV + vec2(uTexel.x, 0.0)).rgb
            + texture2D(uFrame, vUV - vec2(uTexel.x, 0.0)).rgb
            + texture2D(uFrame, vUV + vec2(0.0, uTexel.y)).rgb
            + texture2D(uFrame, vUV - vec2(0.0, uTexel.y)).rgb;
    res += (c - nb * 0.25) * uSharp;
  }

  // ===== 4. 화이트 밸런스 =====
  res *= vec3(1.0 + 0.09 * uWB, 1.0 + 0.015 * uWB, 1.0 - 0.09 * uWB);

  // ===== 5. RGB 게인 =====
  res *= uRGB;

  // ===== 6. 콘트라스트 & 채도 =====
  res = (res - 0.5) * uContrast + 0.5;
  res = clamp(res, 0.0, 1.0);
  float sl = dot(res, vec3(0.299, 0.587, 0.114));
  res = mix(vec3(sl), res, uSat);

  // ===== 7. 필름 그레이드 (메인 룩) =====
  if (uFilm > 0.005) {
    vec3 f = res;
    f = f * (1.0 - 0.13 * uFilm) + vec3(0.06 * uFilm);
    f = mix(f, f * f * (3.0 - 2.0 * f), 0.28 * uFilm);
    float l = dot(f, vec3(0.299, 0.587, 0.114));
    f = mix(vec3(l), f, 1.0 - 0.18 * uFilm);
    f *= vec3(1.0 + 0.045 * uFilm, 1.0 + 0.010 * uFilm, 1.0 - 0.045 * uFilm);
    vec2 dv = vUV - 0.5;
    f *= 1.0 - dot(dv, dv) * 0.65 * uFilm;
    float g = fract(sin(dot(gl_FragCoord.xy + vec2(uTime * 617.0), vec2(12.9898, 78.233))) * 43758.5453) - 0.5;
    f += g * 0.055 * uFilm;
    res = f;
  }

  gl_FragColor = vec4(clamp(res, 0.0, 1.0), 1.0);
}`;

function initGLOnce() {
  if (glReady || !gl) return glReady;
  const compile = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; }
    return s;
  };
  const vs = compile(gl.VERTEX_SHADER, VS);
  const fs = compile(gl.FRAGMENT_SHADER, FS);
  if (!vs || !fs) return false;
  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return false;
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, "aPos");
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  const mkTex = (unit) => {
    const t = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    return t;
  };
  mkTex(0); mkTex(1);
  ["uFrame","uMask","uTexel","uRadius","uSmooth","uBlemish","uSkinShift",
   "uFilm","uSharp","uContrast","uSat","uRGB","uWB","uTime"]
    .forEach(n => uLoc[n] = gl.getUniformLocation(prog, n));
  gl.uniform1i(uLoc.uFrame, 0);
  gl.uniform1i(uLoc.uMask, 1);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  glReady = true;
  return true;
}

function resizeGL(w, h) {
  glCanvas.width = w; glCanvas.height = h;
  gl.viewport(0, 0, w, h);
  gl.uniform2f(uLoc.uTexel, 1 / w, 1 / h);
}

function processFrame() {
  if (!glOK) return video;
  if (lastLandmarks) {
    buildFaceMaskIfNeeded();
    const L = lastLandmarks;
    const faceW = Math.abs(L[454].x - L[234].x) * out.width;
    gl.uniform1f(uLoc.uRadius, Math.max(2.5, faceW * 0.026));
  }
  gl.activeTexture(gl.TEXTURE0);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);

  const hasFace = !!lastLandmarks;
  gl.uniform1f(uLoc.uSmooth,    hasFace ? S.smooth.value / 100 : 0);
  gl.uniform1f(uLoc.uBlemish,   hasFace ? S.blemish.value / 100 : 0);
  gl.uniform1f(uLoc.uSkinShift, hasFace ? S.skinShift.value / 50 : 0);
  gl.uniform1f(uLoc.uFilm,      S.film.value / 100);
  gl.uniform1f(uLoc.uSharp,     S.sharp.value / 100 * 1.1);
  gl.uniform1f(uLoc.uContrast,  S.contrast.value / 100);
  gl.uniform1f(uLoc.uSat,       S.sat.value / 100);
  gl.uniform3f(uLoc.uRGB, S.rGain.value / 100, S.gGain.value / 100, S.bGain.value / 100);
  gl.uniform1f(uLoc.uWB, wbValue);
  gl.uniform1f(uLoc.uTime, (performance.now() % 10000) / 10000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  return glCanvas;
}

/* ===== 카메라 시작 / 전환 ===== */
async function startStream() {
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: 720 }, height: { ideal: 960 } },
    audio: false,
  });
  video.srcObject = stream;
  await video.play();

  out.width = video.videoWidth;
  out.height = video.videoHeight;
  maskCanvas.width = Math.round(video.videoWidth / 4);
  maskCanvas.height = Math.round(video.videoHeight / 4);

  glOK = initGLOnce();
  if (glOK) {
    resizeGL(video.videoWidth, video.videoHeight);
    gl.activeTexture(gl.TEXTURE1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, maskCanvas);
  }
  lastLandmarks = null;
  maskDirty = false;
  tryFocus("continuous");   // 자동초점 유지 요청 (지원 기기에서)
}

startBtn.addEventListener("click", async () => {
  startBtn.disabled = true;
  startBtn.textContent = "준비 중…";
  try {
    const fileset = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    landmarker = await FaceLandmarker.createFromOptions(fileset, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate: "GPU",
      },
      runningMode: "VIDEO",
      numFaces: 1,
    });
    await startStream();
    if (!glOK) alert("이 기기는 GPU 처리(WebGL)를 지원하지 않아 원본 그대로 표시돼요.");
    stage.classList.add("live");
    shotBtn.disabled = false;
    requestAnimationFrame(loop);
  } catch (err) {
    startBtn.disabled = false;
    startBtn.textContent = "카메라 켜기";
    alert("카메라를 켤 수 없어요.\n브라우저의 카메라 권한을 확인해 주세요.\n\n" + err.message);
  }
});

flipBtn.addEventListener("click", async () => {
  if (!stage.classList.contains("live")) return;
  facing = (facing === "user") ? "environment" : "user";
  try { await startStream(); }
  catch (err) {
    facing = (facing === "user") ? "environment" : "user";   // 실패 시 원복
    await startStream().catch(() => {});
    alert("카메라 전환에 실패했어요: " + err.message);
  }
});

/* ===== 탭하여 초점 ===== */
function tryFocus(mode) {
  const track = video.srcObject?.getVideoTracks()[0];
  if (!track || !track.getCapabilities) return;
  const caps = track.getCapabilities();
  if (!caps.focusMode) return;   // 초점 제어 미지원 기기 → 조용히 무시
  const m = caps.focusMode.includes(mode) ? mode
          : caps.focusMode.includes("continuous") ? "continuous" : null;
  if (m) track.applyConstraints({ advanced: [{ focusMode: m }] }).catch(() => {});
}

stage.addEventListener("click", (e) => {
  if (!stage.classList.contains("live")) return;
  if (e.target !== out) return;   // 버튼·패널 클릭은 무시, 화면 탭만
  // 열린 패널이 있으면 닫기
  const openPanel = document.querySelector(".panel.open");
  if (openPanel) {
    openPanel.classList.remove("open");
    document.querySelectorAll(".dock-btn").forEach(b => b.classList.remove("on"));
    return;
  }
  // 초점 링 + 재초점 시도
  focusRing.style.left = e.clientX + "px";
  focusRing.style.top = e.clientY + "px";
  focusRing.classList.remove("go");
  void focusRing.offsetWidth;
  focusRing.classList.add("go");
  tryFocus("single-shot");
  setTimeout(() => tryFocus("continuous"), 900);
});

/* ===== 메인 루프 ===== */
let frameCount = 0;
let lastSeen = 0;
let maskDirty = false;
let lastRenderTs = 0;

function loop(ts) {
  requestAnimationFrame(loop);
  if (video.readyState < 2) return;
  if (ts - lastRenderTs < 31) return;   // 30fps 상한
  lastRenderTs = ts;

  if (frameCount % 3 === 0) {
    const result = landmarker.detectForVideo(video, performance.now());
    const fresh = result.faceLandmarks?.[0] ?? null;
    if (fresh) {
      lastLandmarks = fresh;
      lastSeen = performance.now();
      maskDirty = true;
    } else if (performance.now() - lastSeen > 5000) {
      lastLandmarks = null;
    }
  }
  frameCount++;

  statusEl.classList.toggle("tracking", !!lastLandmarks);
  statusText.textContent = lastLandmarks ? "얼굴 인식 중" : "얼굴 찾는 중…";

  render();
}

function render() {
  const w = out.width, h = out.height;
  const src = processFrame();
  const mirrored = facing === "user";   // 전면만 셀카 미러링

  ctx.save();
  if (mirrored) { ctx.translate(w, 0); ctx.scale(-1, 1); }
  ctx.drawImage(src, 0, 0, w, h);

  if (lastLandmarks && showMeshEl.checked) {
    ctx.fillStyle = "rgba(255,143,171,0.9)";
    for (const p of lastLandmarks) {
      ctx.beginPath();
      ctx.arc(p.x * w, p.y * h, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

function buildFaceMaskIfNeeded() {
  if (!maskDirty) return;
  buildFaceMask(maskCanvas.width, maskCanvas.height);
  gl.activeTexture(gl.TEXTURE1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, maskCanvas);
  maskDirty = false;
}

function buildFaceMask(w, h) {
  maskCtx.clearRect(0, 0, w, h);
  const L = lastLandmarks;

  maskCtx.save();
  maskCtx.filter = "blur(" + w * 0.015 + "px)";
  maskCtx.fillStyle = "#fff";
  maskCtx.beginPath();
  FACE_OVAL.forEach((idx, i) => {
    const p = L[idx];
    i === 0 ? maskCtx.moveTo(p.x * w, p.y * h) : maskCtx.lineTo(p.x * w, p.y * h);
  });
  maskCtx.closePath();
  maskCtx.fill();
  maskCtx.restore();

  const faceW = Math.abs(L[454].x - L[234].x) * w;

  const nTop = L[168], nBot = L[2];
  const ncx = (nTop.x + nBot.x) / 2 * w;
  const ncy = (nTop.y + nBot.y) / 2 * h;
  const ndx = (nBot.x - nTop.x) * w;
  const ndy = (nBot.y - nTop.y) * h;
  const nLen = Math.hypot(ndx, ndy);
  const nAng = Math.atan2(ndy, ndx) - Math.PI / 2;
  maskCtx.save();
  maskCtx.filter = "blur(" + w * 0.01 + "px)";
  maskCtx.fillStyle = "#fff";
  maskCtx.beginPath();
  maskCtx.ellipse(ncx, ncy, faceW * 0.14, nLen * 0.8, nAng, 0, Math.PI * 2);
  maskCtx.fill();
  maskCtx.restore();

  maskCtx.save();
  maskCtx.globalCompositeOperation = "destination-out";
  maskCtx.filter = "blur(" + faceW * 0.02 + "px)";
  maskCtx.fillStyle = "#fff";
  carveEllipse(L[159], L[145], faceW * 0.15, faceW * 0.07, w, h);
  carveEllipse(L[386], L[374], faceW * 0.15, faceW * 0.07, w, h);
  carveEllipse(L[105], L[105], faceW * 0.16, faceW * 0.045, w, h);
  carveEllipse(L[334], L[334], faceW * 0.16, faceW * 0.045, w, h);
  carveEllipse(L[13],  L[14],  faceW * 0.22, faceW * 0.11, w, h);
  maskCtx.restore();
}

function carveEllipse(top, bottom, rx, ry, w, h) {
  const cx = (top.x + bottom.x) / 2 * w;
  const cy = (top.y + bottom.y) / 2 * h;
  maskCtx.beginPath();
  maskCtx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  maskCtx.fill();
}

/* ===== 사진 찍기 (화면 플래시 포함) ===== */
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

function capture() {
  const a = document.createElement("a");
  a.href = out.toDataURL("image/png");
  const t = new Date();
  a.download = "film-cam_" + t.getHours() + "시" + t.getMinutes() + "분" + t.getSeconds() + "초.png";
  a.click();
}

shotBtn.addEventListener("click", async () => {
  if (useFlash && facing === "user") {
    screenFlash.classList.add("on");
    await sleep(400);   // 화면 빛이 얼굴에 닿고 카메라 노출이 적응할 시간
    capture();
    await sleep(150);
    screenFlash.classList.remove("on");
  } else {
    capture();
  }
});
</script>
