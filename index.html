<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>뷰티 카메라 데모</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #101014;
    --surface: #1a1a21;
    --surface-2: #23232c;
    --text: #f2f0f4;
    --text-dim: #9a97a3;
    --accent: #ff8fab;
    --accent-deep: #e5678b;
    --line: #2e2e39;
    --radius: 18px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 32px;
    gap: 16px;
  }
  header { text-align: center; }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  header h1 .dot { color: var(--accent); }
  header p { font-size: 13px; color: var(--text-dim); margin-top: 4px; }

  .viewfinder {
    position: relative;
    width: min(92vw, 480px);
    aspect-ratio: 3 / 4;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .viewfinder canvas { width: 100%; height: 100%; object-fit: cover; display: none; }
  .viewfinder.live canvas { display: block; }
  .viewfinder.live .placeholder { display: none; }
  .placeholder {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    text-align: center; padding: 24px;
  }
  .placeholder .lens {
    width: 72px; height: 72px; border-radius: 50%;
    border: 2px solid var(--line);
    display: flex; align-items: center; justify-content: center;
  }
  .placeholder .lens::after {
    content: ""; width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #4a4a5a, #17171d 70%);
  }
  .placeholder p { font-size: 14px; color: var(--text-dim); line-height: 1.6; }

  #startBtn {
    background: var(--accent); color: #26101a;
    border: none; font-family: inherit;
    font-size: 15px; font-weight: 700;
    padding: 12px 28px; border-radius: 999px; cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  #startBtn:hover { background: var(--accent-deep); color: #fff; transform: translateY(-1px); }
  #startBtn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .status {
    position: absolute; top: 12px; left: 12px;
    background: rgba(16,16,20,0.72);
    backdrop-filter: blur(6px);
    font-size: 12px; color: var(--text-dim);
    padding: 5px 11px; border-radius: 999px;
    display: none; align-items: center; gap: 6px;
  }
  .viewfinder.live .status { display: flex; }
  .status .led { width: 7px; height: 7px; border-radius: 50%; background: #666; }
  .status.tracking .led { background: #6ee7a0; }
  .status.tracking { color: #cfeee0; }

  .filters {
    width: min(92vw, 480px);
    display: flex; gap: 8px;
    overflow-x: auto; padding-bottom: 4px;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    background: var(--surface); border: 1px solid var(--line);
    color: var(--text-dim); font-family: inherit;
    font-size: 13px; font-weight: 500;
    padding: 8px 16px; border-radius: 999px; cursor: pointer;
    transition: all 0.12s ease;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #26101a; font-weight: 700; }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .controls {
    width: min(92vw, 480px);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .row { display: flex; align-items: center; gap: 12px; }
  .row label { font-size: 14px; font-weight: 500; flex: 0 0 84px; }
  .row output { font-size: 13px; color: var(--accent); flex: 0 0 36px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type="range"] {
    flex: 1; appearance: none; height: 4px; border-radius: 2px;
    background: var(--surface-2); cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); border: 3px solid var(--bg);
    box-shadow: 0 0 0 1px var(--line);
  }
  input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; }
  .toggle-row span { font-size: 14px; font-weight: 500; }
  .toggle-row small { display: block; font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .switch { position: relative; width: 44px; height: 25px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 100%; height: 100%; position: absolute; cursor: pointer; z-index: 1; }
  .switch .track {
    position: absolute; inset: 0; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--line);
    transition: background 0.15s ease;
  }
  .switch .track::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 19px; height: 19px; border-radius: 50%;
    background: var(--text-dim); transition: all 0.15s ease;
  }
  .switch input:checked + .track { background: var(--accent); border-color: var(--accent); }
  .switch input:checked + .track::after { left: 21px; background: #26101a; }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

  #shotBtn {
    background: transparent; border: 1px solid var(--accent); color: var(--accent);
    font-family: inherit; font-size: 14px; font-weight: 700;
    padding: 12px; border-radius: 999px; cursor: pointer;
    transition: all 0.12s ease;
  }
  #shotBtn:hover:not(:disabled) { background: var(--accent); color: #26101a; }
  #shotBtn:disabled { opacity: 0.35; cursor: default; }
  #shotBtn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash.go { animation: flash 0.35s ease; }
  @keyframes flash { 0% { opacity: 0.9; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .flash.go { animation: none; }
    #startBtn:hover { transform: none; }
  }

  footer { font-size: 12px; color: var(--text-dim); text-align: center; line-height: 1.7; max-width: 480px; }
</style>
</head>
<body>

<header>
  <h1>뷰티 카메라<span class="dot">.</span></h1>
  <p>필름 룩 · GPU 피부 보정 · 잡티 제거</p>
</header>

<div class="viewfinder" id="viewfinder">
  <div class="placeholder">
    <div class="lens" aria-hidden="true"></div>
    <p>카메라를 켜면 얼굴을 인식해서<br />실시간으로 보정을 적용해요.</p>
    <button id="startBtn">카메라 켜기</button>
  </div>
  <canvas id="out"></canvas>
  <div class="status" id="status"><span class="led"></span><span id="statusText">얼굴 찾는 중…</span></div>
  <div class="flash" id="flash"></div>
</div>

<div class="filters" id="filters" role="group" aria-label="색감 필터">
  <button class="chip on" data-filter="none">원본</button>
  <button class="chip" data-filter="bright">화사</button>
  <button class="chip" data-filter="cool">청순</button>
  <button class="chip" data-filter="warm">노을</button>
  <button class="chip" data-filter="mono">흑백</button>
</div>

<div class="controls">
  <div class="row">
    <label for="smooth">부드럽게</label>
    <input type="range" id="smooth" min="0" max="100" value="40" />
    <output id="smoothVal">40</output>
  </div>
  <div class="row">
    <label for="blemish">잡티 제거</label>
    <input type="range" id="blemish" min="0" max="100" value="60" />
    <output id="blemishVal">60</output>
  </div>
  <div class="row">
    <label for="film">필름 감성</label>
    <input type="range" id="film" min="0" max="100" value="50" />
    <output id="filmVal">50</output>
  </div>
  <div class="toggle-row">
    <div>
      <span>얼굴 인식 점 보기</span>
      <small>AI가 찾은 랜드마크를 화면에 표시 (학습용)</small>
    </div>
    <div class="switch">
      <input type="checkbox" id="showMesh" />
      <span class="track"></span>
    </div>
  </div>
  <button id="shotBtn" disabled>사진 찍기</button>
</div>

<footer>
  피부 보정은 GPU 양방향 필터로 처리돼요 — 경계는 살리고 피부톤만 고르게.<br />
  모든 처리는 내 기기 안에서만 이루어지고, 영상은 어디에도 전송되지 않아요.
</footer>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const startBtn   = document.getElementById("startBtn");
const viewfinder = document.getElementById("viewfinder");
const out        = document.getElementById("out");
const ctx        = out.getContext("2d");
const statusEl   = document.getElementById("status");
const statusText = document.getElementById("statusText");
const smoothEl   = document.getElementById("smooth");
const smoothVal  = document.getElementById("smoothVal");
const blemishEl  = document.getElementById("blemish");
const blemishVal = document.getElementById("blemishVal");
const filmEl     = document.getElementById("film");
const filmVal    = document.getElementById("filmVal");
const showMeshEl = document.getElementById("showMesh");
const shotBtn    = document.getElementById("shotBtn");
const flash      = document.getElementById("flash");

const video = document.createElement("video");
video.playsInline = true; video.muted = true;

// 얼굴 마스크용 2D 캔버스 (셰이더에 텍스처로 전달됨)
const maskCanvas = document.createElement("canvas");
const maskCtx = maskCanvas.getContext("2d");

// MediaPipe 얼굴 윤곽(face oval) 랜드마크 번호
const FACE_OVAL = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];

const FILTERS = {
  none:   "none",
  bright: "brightness(1.08) saturate(1.12) contrast(1.02)",
  cool:   "brightness(1.06) saturate(0.92) hue-rotate(-8deg) contrast(1.03)",
  warm:   "brightness(1.04) saturate(1.18) sepia(0.18) contrast(1.02)",
  mono:   "grayscale(1) brightness(1.05) contrast(1.08)",
};
let currentFilter = "none";
let landmarker = null;
let lastLandmarks = null;

/* =========================================================
   WebGL: 양방향(bilateral) 필터 + 잡티 제거 셰이더
   - 색이 비슷한 이웃 픽셀만 평균 → 경계(눈매/윤곽)는 보존
   - 주변보다 어두운 점(잡티)만 감지해서 그 부분만 채움
   ========================================================= */
const glCanvas = document.createElement("canvas");
const gl = glCanvas.getContext("webgl", { premultipliedAlpha: false });
let glOK = false, uLoc = {};

const VS = `
attribute vec2 aPos;
varying vec2 vUV;
void main() {
  vUV = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 vUV;
uniform sampler2D uFrame;   // 카메라 프레임
uniform sampler2D uMask;    // 얼굴 마스크 (눈/눈썹/입 제외됨)
uniform vec2  uTexel;       // 1픽셀 크기
uniform float uRadius;      // 샘플 반경(픽셀) — 얼굴 크기에 비례
uniform float uSmooth;      // 0~1 부드럽게
uniform float uBlemish;     // 0~1 잡티 제거
uniform float uFilm;        // 0~1 필름 감성
uniform float uTime;        // 필름 그레인 애니메이션용

void main() {
  vec3 c = texture2D(uFrame, vUV).rgb;
  vec3 res = c;
  float m = texture2D(uMask, vUV).a;

  // ===== 피부 보정 (얼굴 마스크 안에서만) =====
  if (m > 0.01 && (uSmooth > 0.01 || uBlemish > 0.01)) {
    // 1. 양방향 필터: 색이 비슷한 이웃만 가중 평균 → 경계 보존
    float sigmaR = 0.07 + 0.07 * uSmooth;
    vec3 sum = c; float wsum = 1.0; vec3 plain = c;
    for (int i = 0; i < 16; i++) {
      float ang = 0.3926991 * float(i);
      float ring = (mod(float(i), 2.0) < 1.0) ? 1.0 : 0.55;
      vec2 off = vec2(cos(ang), sin(ang)) * uRadius * ring * uTexel;
      vec3 s = texture2D(uFrame, vUV + off).rgb;
      float d = length(s - c);
      float wr = exp(-(d * d) / (2.0 * sigmaR * sigmaR));
      sum += s * wr; wsum += wr; plain += s;
    }
    vec3 base = sum / wsum;   // 경계가 보존된 매끈한 피부
    vec3 avg = plain / 17.0;  // 잡티까지 뭉갠 주변 평균
    vec3 hi = c - base;       // 고주파 = 피부 질감

    // 2. 잡티 제거: '적당히' 어두운 점만 (그림자·콧구멍은 보호)
    float darker = avg.g - c.g;
    float th = 0.045 - 0.018 * uBlemish;
    float spot = smoothstep(th * 0.5, th, darker);
    spot *= 1.0 - smoothstep(0.09, 0.18, darker);
    spot *= smoothstep(0.12, 0.28, c.g);
    spot *= 1.0 - 0.5 * smoothstep(0.65, 0.85, avg.g);
    spot *= 0.85 * uBlemish;
    vec3 r = mix(c, avg, spot);

    // 밝은 반점 균형 — 모공 사이 반짝임까지 같은 민감도로 눌러 대칭 유지
    float brighter = c.g - avg.g;
    float glare = smoothstep(th * 0.5, th, brighter);
    glare *= 0.7 * uBlemish;
    r = mix(r, avg, glare);

    // 3. 구조 보호 스무딩: 음영·윤곽 라인은 피해서 평탄한 피부만 정리
    float dev = abs(avg.g - c.g);
    float structural = smoothstep(0.035, 0.11, dev);
    r = mix(r, base, uSmooth * 0.45 * (1.0 - structural));
    r += hi * 0.20 * (1.0 - max(spot, glare));

    res = mix(c, r, m);
  }

  // ===== 필름 그레이드 (화면 전체 — 이 앱의 메인 룩) =====
  if (uFilm > 0.005) {
    vec3 f = res;
    f = f * (1.0 - 0.10 * uFilm) + vec3(0.045 * uFilm);           // 블랙 리프트 + 하이라이트 압축
    f = mix(f, f * f * (3.0 - 2.0 * f), 0.22 * uFilm);            // 부드러운 S커브
    float l = dot(f, vec3(0.299, 0.587, 0.114));
    f = mix(vec3(l), f, 1.0 - 0.15 * uFilm);                      // 채도를 살짝 낮춰 필름 특유의 차분함
    f *= vec3(1.0 + 0.030 * uFilm, 1.0 + 0.008 * uFilm, 1.0 - 0.028 * uFilm); // 따뜻한 틴트
    vec2 dv = vUV - 0.5;
    f *= 1.0 - dot(dv, dv) * 0.45 * uFilm;                        // 비네트
    float g = fract(sin(dot(gl_FragCoord.xy + vec2(uTime * 617.0), vec2(12.9898, 78.233))) * 43758.5453) - 0.5;
    f += g * 0.04 * uFilm;                                        // 살아있는 필름 그레인
    res = clamp(f, 0.0, 1.0);
  }

  gl_FragColor = vec4(res, 1.0);
}`;

function initGL(w, h) {
  if (!gl) return false;
  glCanvas.width = w; glCanvas.height = h;
  gl.viewport(0, 0, w, h);

  const compile = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  };
  const vs = compile(gl.VERTEX_SHADER, VS);
  const fs = compile(gl.FRAGMENT_SHADER, FS);
  if (!vs || !fs) return false;

  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return false;
  gl.useProgram(prog);

  // 화면 전체를 덮는 삼각형 하나
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, "aPos");
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const mkTex = (unit) => {
    const t = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    return t;
  };
  mkTex(0); // uFrame
  mkTex(1); // uMask

  ["uFrame","uMask","uTexel","uRadius","uSmooth","uBlemish","uFilm","uTime"].forEach(n => uLoc[n] = gl.getUniformLocation(prog, n));
  gl.uniform1i(uLoc.uFrame, 0);
  gl.uniform1i(uLoc.uMask, 1);
  gl.uniform2f(uLoc.uTexel, 1 / w, 1 / h);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  return true;
}

// 매 프레임: 카메라 → GPU 보정 → 보정된 캔버스 반환
function processFrame() {
  const s = lastLandmarks ? smoothEl.value / 100 : 0;
  const b = lastLandmarks ? blemishEl.value / 100 : 0;
  const f = filmEl.value / 100;
  if (!glOK || (s < 0.01 && b < 0.01 && f < 0.005)) return video;

  if (lastLandmarks) {
    buildFaceMaskIfNeeded();
    const L = lastLandmarks;
    const faceW = Math.abs(L[454].x - L[234].x) * out.width;
    gl.uniform1f(uLoc.uRadius, Math.max(2.5, faceW * 0.026));
  }

  gl.activeTexture(gl.TEXTURE0);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);

  gl.uniform1f(uLoc.uSmooth, s);
  gl.uniform1f(uLoc.uBlemish, b);
  gl.uniform1f(uLoc.uFilm, f);
  gl.uniform1f(uLoc.uTime, (performance.now() % 10000) / 10000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  return glCanvas;
}

/* ========================================================= */

document.getElementById("filters").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
  chip.classList.add("on");
  currentFilter = chip.dataset.filter;
});

smoothEl.addEventListener("input", () => smoothVal.textContent = smoothEl.value);
blemishEl.addEventListener("input", () => blemishVal.textContent = blemishEl.value);
filmEl.addEventListener("input", () => filmVal.textContent = filmEl.value);

startBtn.addEventListener("click", async () => {
  startBtn.disabled = true;
  startBtn.textContent = "준비 중…";
  try {
    const fileset = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    landmarker = await FaceLandmarker.createFromOptions(fileset, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate: "GPU",
      },
      runningMode: "VIDEO",
      numFaces: 1,
    });

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 960 } },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();

    out.width = video.videoWidth;
    out.height = video.videoHeight;
    // 마스크는 1/4 해상도로 충분 (어차피 경계가 흐릿한 마스크라 화질 손실 없음) → 성능 대폭 절약
    maskCanvas.width = Math.round(video.videoWidth / 4);
    maskCanvas.height = Math.round(video.videoHeight / 4);
    glOK = initGL(video.videoWidth, video.videoHeight);
    if (glOK) {
      // 얼굴을 찾기 전에도 필름 룩이 돌아가도록 빈 마스크를 미리 올려둠
      gl.activeTexture(gl.TEXTURE1);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, maskCanvas);
    }
    if (!glOK) {
      alert("이 기기는 GPU 보정(WebGL)을 지원하지 않아 보정 없이 표시돼요.");
    }

    viewfinder.classList.add("live");
    shotBtn.disabled = false;
    requestAnimationFrame(loop);
  } catch (err) {
    startBtn.disabled = false;
    startBtn.textContent = "카메라 켜기";
    alert("카메라를 켤 수 없어요.\n브라우저 주소창 옆의 카메라 권한을 확인해 주세요.\n\n" + err.message);
  }
});

let frameCount = 0;
let lastSeen = 0;        // 마지막으로 얼굴을 인식한 시각
let maskDirty = false;   // 랜드마크가 갱신됐을 때만 마스크를 다시 만듦
let lastRenderTs = 0;

function loop(ts) {
  requestAnimationFrame(loop);
  if (video.readyState < 2) return;
  if (ts - lastRenderTs < 31) return;   // 30fps 상한 — 카메라도 30fps라 화질 손해 없이 발열만 절약
  lastRenderTs = ts;

  // 얼굴 인식은 3프레임에 1번만 (초당 10회) — 가장 무거운 작업
  if (frameCount % 3 === 0) {
    const result = landmarker.detectForVideo(video, performance.now());
    const fresh = result.faceLandmarks?.[0] ?? null;
    if (fresh) {
      lastLandmarks = fresh;
      lastSeen = performance.now();
      maskDirty = true;
    } else if (performance.now() - lastSeen > 5000) {
      // 5초 이내에는 마지막 인식 위치를 유지 → 얼굴 일부만 보여도 보정 지속
      lastLandmarks = null;
    }
  }
  frameCount++;

  statusEl.classList.toggle("tracking", !!lastLandmarks);
  statusText.textContent = lastLandmarks ? "얼굴 인식 중" : "얼굴 찾는 중…";

  render();
}

function render() {
  const w = out.width, h = out.height;
  const src = processFrame();   // GPU 보정된 프레임 (또는 원본)

  ctx.save();
  ctx.translate(w, 0); ctx.scale(-1, 1);   // 셀카 미러링

  ctx.filter = FILTERS[currentFilter];
  ctx.drawImage(src, 0, 0, w, h);
  ctx.filter = "none";

  if (lastLandmarks && showMeshEl.checked) {
    ctx.fillStyle = "rgba(255,143,171,0.9)";
    for (const p of lastLandmarks) {
      ctx.beginPath();
      ctx.arc(p.x * w, p.y * h, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

// 랜드마크가 갱신됐을 때만 마스크를 다시 만들고 GPU에 올림 (프레임마다 만들면 낭비)
function buildFaceMaskIfNeeded() {
  if (!maskDirty) return;
  buildFaceMask(maskCanvas.width, maskCanvas.height);
  gl.activeTexture(gl.TEXTURE1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, maskCanvas);
  maskDirty = false;
}

// 얼굴 윤곽을 채우고 눈·눈썹·입·콧방울은 비워둔 마스크
function buildFaceMask(w, h) {
  maskCtx.clearRect(0, 0, w, h);
  const L = lastLandmarks;

  maskCtx.save();
  maskCtx.filter = "blur(" + w * 0.015 + "px)";
  maskCtx.fillStyle = "#fff";
  maskCtx.beginPath();
  FACE_OVAL.forEach((idx, i) => {
    const p = L[idx];
    i === 0 ? maskCtx.moveTo(p.x * w, p.y * h) : maskCtx.lineTo(p.x * w, p.y * h);
  });
  maskCtx.closePath();
  maskCtx.fill();
  maskCtx.restore();

  const faceW = Math.abs(L[454].x - L[234].x) * w;

  // 코 영역 추가 — 옆모습에서 코가 얼굴 윤곽선 밖으로 튀어나가는 문제 보완
  // 미간(168)→코밑(2)을 잇는 축을 따라 회전된 타원으로 코 전체를 덮는다
  const nTop = L[168], nBot = L[2];
  const ncx = (nTop.x + nBot.x) / 2 * w;
  const ncy = (nTop.y + nBot.y) / 2 * h;
  const ndx = (nBot.x - nTop.x) * w;
  const ndy = (nBot.y - nTop.y) * h;
  const nLen = Math.hypot(ndx, ndy);
  const nAng = Math.atan2(ndy, ndx) - Math.PI / 2;
  maskCtx.save();
  maskCtx.filter = "blur(" + w * 0.01 + "px)";
  maskCtx.fillStyle = "#fff";
  maskCtx.beginPath();
  maskCtx.ellipse(ncx, ncy, faceW * 0.14, nLen * 0.8, nAng, 0, Math.PI * 2);
  maskCtx.fill();
  maskCtx.restore();

  maskCtx.save();
  maskCtx.globalCompositeOperation = "destination-out";
  maskCtx.filter = "blur(" + faceW * 0.02 + "px)";
  maskCtx.fillStyle = "#fff";
  carveEllipse(L[159], L[145], faceW * 0.15, faceW * 0.07, w, h);   // 왼눈
  carveEllipse(L[386], L[374], faceW * 0.15, faceW * 0.07, w, h);   // 오른눈
  carveEllipse(L[105], L[105], faceW * 0.16, faceW * 0.045, w, h);  // 왼눈썹
  carveEllipse(L[334], L[334], faceW * 0.16, faceW * 0.045, w, h);  // 오른눈썹
  carveEllipse(L[13],  L[14],  faceW * 0.22, faceW * 0.11, w, h);   // 입
  maskCtx.restore();
}

function carveEllipse(top, bottom, rx, ry, w, h) {
  const cx = (top.x + bottom.x) / 2 * w;
  const cy = (top.y + bottom.y) / 2 * h;
  maskCtx.beginPath();
  maskCtx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  maskCtx.fill();
}

shotBtn.addEventListener("click", () => {
  flash.classList.remove("go");
  void flash.offsetWidth;
  flash.classList.add("go");

  const a = document.createElement("a");
  a.href = out.toDataURL("image/png");
  const t = new Date();
  a.download = "beauty-cam_" + t.getHours() + "시" + t.getMinutes() + "분" + t.getSeconds() + "초.png";
  a.click();
});
</script>
