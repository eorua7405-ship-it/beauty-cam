<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>필름 카메라</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #101014;
    --surface: #1a1a21;
    --surface-2: #23232c;
    --text: #f2f0f4;
    --text-dim: #9a97a3;
    --accent: #ff8fab;
    --accent-deep: #e5678b;
    --line: #2e2e39;
    --radius: 18px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 32px;
    gap: 16px;
  }
  header { text-align: center; }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  header h1 .dot { color: var(--accent); }
  header p { font-size: 13px; color: var(--text-dim); margin-top: 4px; }

  .viewfinder {
    position: relative;
    width: min(92vw, 480px);
    aspect-ratio: 3 / 4;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .viewfinder canvas { width: 100%; height: 100%; object-fit: cover; display: none; }
  .viewfinder.live canvas { display: block; }
  .viewfinder.live .placeholder { display: none; }
  .placeholder {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    text-align: center; padding: 24px;
  }
  .placeholder .lens {
    width: 72px; height: 72px; border-radius: 50%;
    border: 2px solid var(--line);
    display: flex; align-items: center; justify-content: center;
  }
  .placeholder .lens::after {
    content: ""; width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #4a4a5a, #17171d 70%);
  }
  .placeholder p { font-size: 14px; color: var(--text-dim); line-height: 1.6; }

  #startBtn {
    background: var(--accent); color: #26101a;
    border: none; font-family: inherit;
    font-size: 15px; font-weight: 700;
    padding: 12px 28px; border-radius: 999px; cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  #startBtn:hover { background: var(--accent-deep); color: #fff; transform: translateY(-1px); }
  #startBtn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .status {
    position: absolute; top: 12px; left: 12px;
    background: rgba(16,16,20,0.72);
    backdrop-filter: blur(6px);
    font-size: 12px; color: var(--text-dim);
    padding: 5px 11px; border-radius: 999px;
    display: none; align-items: center; gap: 6px;
  }
  .viewfinder.live .status { display: flex; }
  .status .led { width: 7px; height: 7px; border-radius: 50%; background: #666; }
  .status.tracking .led { background: #6ee7a0; }
  .status.tracking { color: #cfeee0; }

  .controls {
    width: min(92vw, 480px);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .sec {
    font-size: 11px; font-weight: 700; letter-spacing: 0.14em;
    color: var(--accent); text-transform: uppercase;
    margin-top: 6px;
  }
  .sec:first-child { margin-top: 0; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row label { font-size: 13px; font-weight: 500; flex: 0 0 72px; }
  .row output { font-size: 12px; color: var(--accent); flex: 0 0 34px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type="range"] {
    flex: 1; appearance: none; height: 4px; border-radius: 2px;
    background: var(--surface-2); cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    appearance: none; width: 17px; height: 17px; border-radius: 50%;
    background: var(--accent); border: 3px solid var(--bg);
    box-shadow: 0 0 0 1px var(--line);
  }
  input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

  .wb-row { display: flex; flex-direction: column; gap: 8px; }
  .wb-row > span { font-size: 13px; font-weight: 500; }
  .seg { display: flex; gap: 6px; }
  .seg-btn {
    flex: 1;
    background: var(--surface-2); border: 1px solid var(--line);
    color: var(--text-dim); font-family: inherit;
    font-size: 12px; font-weight: 500;
    padding: 8px 4px; border-radius: 10px; cursor: pointer;
    transition: all 0.12s ease;
  }
  .seg-btn.on { background: var(--accent); border-color: var(--accent); color: #26101a; font-weight: 700; }
  .seg-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; }
  .toggle-row span { font-size: 13px; font-weight: 500; }
  .toggle-row small { display: block; font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .switch { position: relative; width: 44px; height: 25px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 100%; height: 100%; position: absolute; cursor: pointer; z-index: 1; }
  .switch .track {
    position: absolute; inset: 0; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--line);
    transition: background 0.15s ease;
  }
  .switch .track::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 19px; height: 19px; border-radius: 50%;
    background: var(--text-dim); transition: all 0.15s ease;
  }
  .switch input:checked + .track { background: var(--accent); border-color: var(--accent); }
  .switch input:checked + .track::after { left: 21px; background: #26101a; }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

  #shotBtn {
    background: transparent; border: 1px solid var(--accent); color: var(--accent);
    font-family: inherit; font-size: 14px; font-weight: 700;
    padding: 12px; border-radius: 999px; cursor: pointer;
    transition: all 0.12s ease;
    margin-top: 4px;
  }
  #shotBtn:hover:not(:disabled) { background: var(--accent); color: #26101a; }
  #shotBtn:disabled { opacity: 0.35; cursor: default; }
  #shotBtn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* 화면 플래시 — 전체 화면을 최대 밝기 흰색으로 */
  #screenFlash {
    position: fixed; inset: 0;
    background: #fff;
    opacity: 0; pointer-events: none;
    transition: opacity 0.1s ease;
    z-index: 100;
  }
  #screenFlash.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    #startBtn:hover { transform: none; }
  }

  footer { font-size: 12px; color: var(--text-dim); text-align: center; line-height: 1.7; max-width: 480px; }
</style>
</head>
<body>

<header>
  <h1>필름 카메라<span class="dot">.</span></h1>
  <p>필름 룩 · GPU 피부 보정 · 매뉴얼 컨트롤</p>
</header>

<div class="viewfinder" id="viewfinder">
  <div class="placeholder">
    <div class="lens" aria-hidden="true"></div>
    <p>카메라를 켜면 얼굴을 인식해서<br />실시간으로 보정을 적용해요.</p>
    <button id="startBtn">카메라 켜기</button>
  </div>
  <canvas id="out"></canvas>
  <div class="status" id="status"><span class="led"></span><span id="statusText">얼굴 찾는 중…</span></div>
</div>

<div class="controls">
  <div class="sec">피부</div>
  <div class="row">
    <label for="smooth">부드럽게</label>
    <input type="range" id="smooth" min="0" max="100" value="30" />
    <output id="smoothVal">30</output>
  </div>
  <div class="row">
    <label for="blemish">잡티 제거</label>
    <input type="range" id="blemish" min="0" max="100" value="65" />
    <output id="blemishVal">65</output>
  </div>
  <div class="row">
    <label for="skinShift">피부 톤</label>
    <input type="range" id="skinShift" min="-50" max="50" value="0" />
    <output id="skinShiftVal">0</output>
  </div>

  <div class="sec">룩</div>
  <div class="row">
    <label for="film">필름 감성</label>
    <input type="range" id="film" min="0" max="100" value="50" />
    <output id="filmVal">50</output>
  </div>
  <div class="row">
    <label for="sharp">선명도</label>
    <input type="range" id="sharp" min="0" max="100" value="15" />
    <output id="sharpVal">15</output>
  </div>
  <div class="row">
    <label for="contrast">콘트라스트</label>
    <input type="range" id="contrast" min="50" max="150" value="100" />
    <output id="contrastVal">100</output>
  </div>
  <div class="row">
    <label for="sat">채도</label>
    <input type="range" id="sat" min="0" max="200" value="100" />
    <output id="satVal">100</output>
  </div>
  <div class="wb-row">
    <span>화이트 밸런스</span>
    <div class="seg" id="wbSeg" role="group" aria-label="화이트 밸런스">
      <button class="seg-btn on" data-wb="auto">오토</button>
      <button class="seg-btn" data-wb="3300">3300K</button>
      <button class="seg-btn" data-wb="4400">4400K</button>
      <button class="seg-btn" data-wb="5600">5600K</button>
    </div>
  </div>

  <div class="sec">색 (RGB)</div>
  <div class="row">
    <label for="rGain">레드</label>
    <input type="range" id="rGain" min="70" max="130" value="100" />
    <output id="rGainVal">100</output>
  </div>
  <div class="row">
    <label for="gGain">그린</label>
    <input type="range" id="gGain" min="70" max="130" value="100" />
    <output id="gGainVal">100</output>
  </div>
  <div class="row">
    <label for="bGain">블루</label>
    <input type="range" id="bGain" min="70" max="130" value="100" />
    <output id="bGainVal">100</output>
  </div>

  <div class="sec">촬영</div>
  <div class="toggle-row">
    <div>
      <span>화면 플래시</span>
      <small>찍는 순간 화면 전체가 하얗게 빛나 얼굴을 밝혀줘요</small>
    </div>
    <div class="switch">
      <input type="checkbox" id="useFlash" checked />
      <span class="track"></span>
    </div>
  </div>
  <div class="toggle-row">
    <div>
      <span>얼굴 인식 점 보기</span>
      <small>AI가 찾은 랜드마크를 화면에 표시 (학습용)</small>
    </div>
    <div class="switch">
      <input type="checkbox" id="showMesh" />
      <span class="track"></span>
    </div>
  </div>
  <button id="shotBtn" disabled>사진 찍기</button>
</div>

<footer>
  피부 보정·필름 룩·매뉴얼 컨트롤이 전부 GPU에서 실시간 처리돼요.<br />
  모든 처리는 내 기기 안에서만 이루어지고, 영상은 어디에도 전송되지 않아요.
</footer>

<div id="screenFlash"></div>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const $ = (id) => document.getElementById(id);
const startBtn   = $("startBtn");
const viewfinder = $("viewfinder");
const out        = $("out");
const ctx        = out.getContext("2d");
const statusEl   = $("status");
const statusText = $("statusText");
const showMeshEl = $("showMesh");
const useFlashEl = $("useFlash");
const shotBtn    = $("shotBtn");
const screenFlash = $("screenFlash");

// 슬라이더 등록: [id, 표시요소] 자동 연결
const SLIDERS = ["smooth","blemish","skinShift","film","sharp","contrast","sat","rGain","gGain","bGain"];
const S = {};
for (const id of SLIDERS) {
  S[id] = $(id);
  const val = $(id + "Val");
  S[id].addEventListener("input", () => val.textContent = S[id].value);
}

// 화이트 밸런스: 오토=0, 3300K=차갑게, 5600K=따뜻하게
const WB_MAP = { auto: 0.0, "3300": -1.0, "4400": 0.35, "5600": 1.0 };
let wbValue = 0.0;
$("wbSeg").addEventListener("click", (e) => {
  const btn = e.target.closest(".seg-btn");
  if (!btn) return;
  document.querySelectorAll(".seg-btn").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  wbValue = WB_MAP[btn.dataset.wb];
});

const video = document.createElement("video");
video.playsInline = true; video.muted = true;

const maskCanvas = document.createElement("canvas");
const maskCtx = maskCanvas.getContext("2d");

const FACE_OVAL = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];

let landmarker = null;
let lastLandmarks = null;

/* =========================================================
   WebGL 파이프라인
   피부 보정 → 피부 톤 → 선명도 → WB → RGB → 콘트라스트/채도 → 필름
   ========================================================= */
const glCanvas = document.createElement("canvas");
const gl = glCanvas.getContext("webgl", { premultipliedAlpha: false });
let glOK = false, uLoc = {};

const VS = `
attribute vec2 aPos;
varying vec2 vUV;
void main() {
  vUV = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 vUV;
uniform sampler2D uFrame;
uniform sampler2D uMask;
uniform vec2  uTexel;
uniform float uRadius;
uniform float uSmooth;      // 0~1 부드럽게
uniform float uBlemish;     // 0~1 잡티 제거
uniform float uSkinShift;   // -1~1 피부 톤 (차갑게~따뜻하게, 마스크 안에서만)
uniform float uFilm;        // 0~1 필름 감성
uniform float uSharp;       // 0~ 선명도
uniform float uContrast;    // 0.5~1.5
uniform float uSat;         // 0~2
uniform vec3  uRGB;         // RGB 게인
uniform float uWB;          // -1~1 화이트 밸런스
uniform float uTime;        // 필름 그레인 애니메이션

void main() {
  vec3 c = texture2D(uFrame, vUV).rgb;
  vec3 res = c;
  float m = texture2D(uMask, vUV).a;

  // ===== 1. 피부 보정 (얼굴 마스크 안에서만) =====
  if (m > 0.01 && (uSmooth > 0.01 || uBlemish > 0.01)) {
    float sigmaR = 0.07 + 0.07 * uSmooth;
    vec3 sum = c; float wsum = 1.0; vec3 plain = c;
    for (int i = 0; i < 16; i++) {
      float ang = 0.3926991 * float(i);
      float ring = (mod(float(i), 2.0) < 1.0) ? 1.0 : 0.55;
      vec2 off = vec2(cos(ang), sin(ang)) * uRadius * ring * uTexel;
      vec3 s = texture2D(uFrame, vUV + off).rgb;
      float d = length(s - c);
      float wr = exp(-(d * d) / (2.0 * sigmaR * sigmaR));
      sum += s * wr; wsum += wr; plain += s;
    }
    vec3 base = sum / wsum;
    vec3 avg = plain / 17.0;
    vec3 hi = c - base;

    // 잡티: '적당히' 어두운 점만 (그림자·콧구멍은 보호)
    float darker = avg.g - c.g;
    float th = 0.045 - 0.018 * uBlemish;
    float spot = smoothstep(th * 0.5, th, darker);
    spot *= 1.0 - smoothstep(0.09, 0.18, darker);
    spot *= smoothstep(0.12, 0.28, c.g);
    spot *= 1.0 - 0.5 * smoothstep(0.65, 0.85, avg.g);
    spot *= 0.85 * uBlemish;
    vec3 r = mix(c, avg, spot);

    // 모공 반짝임까지 같은 민감도로 눌러 하얀 반점 방지
    float brighter = c.g - avg.g;
    float glare = smoothstep(th * 0.5, th, brighter);
    glare *= 0.7 * uBlemish;
    r = mix(r, avg, glare);

    // 구조 보호 스무딩 — 그림자·윤곽 라인은 건드리지 않음
    float dev = abs(avg.g - c.g);
    float structural = smoothstep(0.035, 0.11, dev);
    r = mix(r, base, uSmooth * 0.45 * (1.0 - structural));
    r += hi * 0.20 * (1.0 - max(spot, glare));

    res = mix(c, r, m);
  }

  // ===== 2. 피부 톤 (마스크 안에서만: - 차갑게 / + 따뜻하게) =====
  res.r += uSkinShift * 0.05 * m;
  res.b -= uSkinShift * 0.04 * m;

  // ===== 3. 선명도 (언샤프 마스크) =====
  if (uSharp > 0.001) {
    vec3 nb = texture2D(uFrame, vUV + vec2(uTexel.x, 0.0)).rgb
            + texture2D(uFrame, vUV - vec2(uTexel.x, 0.0)).rgb
            + texture2D(uFrame, vUV + vec2(0.0, uTexel.y)).rgb
            + texture2D(uFrame, vUV - vec2(0.0, uTexel.y)).rgb;
    res += (c - nb * 0.25) * uSharp;
  }

  // ===== 4. 화이트 밸런스 =====
  res *= vec3(1.0 + 0.09 * uWB, 1.0 + 0.015 * uWB, 1.0 - 0.09 * uWB);

  // ===== 5. RGB 게인 =====
  res *= uRGB;

  // ===== 6. 콘트라스트 & 채도 =====
  res = (res - 0.5) * uContrast + 0.5;
  res = clamp(res, 0.0, 1.0);
  float sl = dot(res, vec3(0.299, 0.587, 0.114));
  res = mix(vec3(sl), res, uSat);

  // ===== 7. 필름 그레이드 (이 앱의 메인 룩) =====
  if (uFilm > 0.005) {
    vec3 f = res;
    f = f * (1.0 - 0.13 * uFilm) + vec3(0.06 * uFilm);            // 블랙 리프트 + 하이라이트 압축
    f = mix(f, f * f * (3.0 - 2.0 * f), 0.28 * uFilm);            // 부드러운 S커브
    float l = dot(f, vec3(0.299, 0.587, 0.114));
    f = mix(vec3(l), f, 1.0 - 0.18 * uFilm);                      // 채도를 낮춰 필름 특유의 차분함
    f *= vec3(1.0 + 0.045 * uFilm, 1.0 + 0.010 * uFilm, 1.0 - 0.045 * uFilm); // 따뜻한 틴트
    vec2 dv = vUV - 0.5;
    f *= 1.0 - dot(dv, dv) * 0.65 * uFilm;                        // 비네트
    float g = fract(sin(dot(gl_FragCoord.xy + vec2(uTime * 617.0), vec2(12.9898, 78.233))) * 43758.5453) - 0.5;
    f += g * 0.055 * uFilm;                                       // 살아있는 필름 그레인
    res = f;
  }

  gl_FragColor = vec4(clamp(res, 0.0, 1.0), 1.0);
}`;

function initGL(w, h) {
  if (!gl) return false;
  glCanvas.width = w; glCanvas.height = h;
  gl.viewport(0, 0, w, h);

  const compile = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  };
  const vs = compile(gl.VERTEX_SHADER, VS);
  const fs = compile(gl.FRAGMENT_SHADER, FS);
  if (!vs || !fs) return false;

  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return false;
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, "aPos");
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const mkTex = (unit) => {
    const t = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    return t;
  };
  mkTex(0); // uFrame
  mkTex(1); // uMask

  ["uFrame","uMask","uTexel","uRadius","uSmooth","uBlemish","uSkinShift",
   "uFilm","uSharp","uContrast","uSat","uRGB","uWB","uTime"]
    .forEach(n => uLoc[n] = gl.getUniformLocation(prog, n));
  gl.uniform1i(uLoc.uFrame, 0);
  gl.uniform1i(uLoc.uMask, 1);
  gl.uniform2f(uLoc.uTexel, 1 / w, 1 / h);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  return true;
}

// 매 프레임: 카메라 → GPU 처리 → 처리된 캔버스 반환
function processFrame() {
  if (!glOK) return video;

  if (lastLandmarks) {
    buildFaceMaskIfNeeded();
    const L = lastLandmarks;
    const faceW = Math.abs(L[454].x - L[234].x) * out.width;
    gl.uniform1f(uLoc.uRadius, Math.max(2.5, faceW * 0.026));
  }

  gl.activeTexture(gl.TEXTURE0);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);

  const hasFace = !!lastLandmarks;
  gl.uniform1f(uLoc.uSmooth,    hasFace ? S.smooth.value / 100 : 0);
  gl.uniform1f(uLoc.uBlemish,   hasFace ? S.blemish.value / 100 : 0);
  gl.uniform1f(uLoc.uSkinShift, hasFace ? S.skinShift.value / 50 : 0);
  gl.uniform1f(uLoc.uFilm,      S.film.value / 100);
  gl.uniform1f(uLoc.uSharp,     S.sharp.value / 100 * 1.1);
  gl.uniform1f(uLoc.uContrast,  S.contrast.value / 100);
  gl.uniform1f(uLoc.uSat,       S.sat.value / 100);
  gl.uniform3f(uLoc.uRGB, S.rGain.value / 100, S.gGain.value / 100, S.bGain.value / 100);
  gl.uniform1f(uLoc.uWB, wbValue);
  gl.uniform1f(uLoc.uTime, (performance.now() % 10000) / 10000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  return glCanvas;
}

/* ========================================================= */

startBtn.addEventListener("click", async () => {
  startBtn.disabled = true;
  startBtn.textContent = "준비 중…";
  try {
    const fileset = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    landmarker = await FaceLandmarker.createFromOptions(fileset, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate: "GPU",
      },
      runningMode: "VIDEO",
      numFaces: 1,
    });

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 960 } },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();

    out.width = video.videoWidth;
    out.height = video.videoHeight;
    // 마스크는 1/4 해상도로 충분 → 성능 절약
    maskCanvas.width = Math.round(video.videoWidth / 4);
    maskCanvas.height = Math.round(video.videoHeight / 4);

    glOK = initGL(video.videoWidth, video.videoHeight);
    if (glOK) {
      // 얼굴을 찾기 전에도 필름 룩이 돌아가도록 빈 마스크를 미리 올려둠
      gl.activeTexture(gl.TEXTURE1);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, maskCanvas);
    } else {
      alert("이 기기는 GPU 처리(WebGL)를 지원하지 않아 원본 그대로 표시돼요.");
    }

    viewfinder.classList.add("live");
    shotBtn.disabled = false;
    requestAnimationFrame(loop);
  } catch (err) {
    startBtn.disabled = false;
    startBtn.textContent = "카메라 켜기";
    alert("카메라를 켤 수 없어요.\n브라우저 주소창 옆의 카메라 권한을 확인해 주세요.\n\n" + err.message);
  }
});

let frameCount = 0;
let lastSeen = 0;        // 마지막으로 얼굴을 인식한 시각
let maskDirty = false;   // 랜드마크가 갱신됐을 때만 마스크 재생성
let lastRenderTs = 0;

function loop(ts) {
  requestAnimationFrame(loop);
  if (video.readyState < 2) return;
  if (ts - lastRenderTs < 31) return;   // 30fps 상한 — 발열·배터리 절약
  lastRenderTs = ts;

  // 얼굴 인식은 3프레임에 1번 (초당 10회)
  if (frameCount % 3 === 0) {
    const result = landmarker.detectForVideo(video, performance.now());
    const fresh = result.faceLandmarks?.[0] ?? null;
    if (fresh) {
      lastLandmarks = fresh;
      lastSeen = performance.now();
      maskDirty = true;
    } else if (performance.now() - lastSeen > 5000) {
      // 5초 이내에는 마지막 인식 위치 유지 → 얼굴 일부만 보여도 보정 지속
      lastLandmarks = null;
    }
  }
  frameCount++;

  statusEl.classList.toggle("tracking", !!lastLandmarks);
  statusText.textContent = lastLandmarks ? "얼굴 인식 중" : "얼굴 찾는 중…";

  render();
}

function render() {
  const w = out.width, h = out.height;
  const src = processFrame();

  ctx.save();
  ctx.translate(w, 0); ctx.scale(-1, 1);   // 셀카 미러링
  ctx.drawImage(src, 0, 0, w, h);

  if (lastLandmarks && showMeshEl.checked) {
    ctx.fillStyle = "rgba(255,143,171,0.9)";
    for (const p of lastLandmarks) {
      ctx.beginPath();
      ctx.arc(p.x * w, p.y * h, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

function buildFaceMaskIfNeeded() {
  if (!maskDirty) return;
  buildFaceMask(maskCanvas.width, maskCanvas.height);
  gl.activeTexture(gl.TEXTURE1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, maskCanvas);
  maskDirty = false;
}

// 얼굴 윤곽을 채우고 눈·눈썹·입은 비워둔 마스크
function buildFaceMask(w, h) {
  maskCtx.clearRect(0, 0, w, h);
  const L = lastLandmarks;

  maskCtx.save();
  maskCtx.filter = "blur(" + w * 0.015 + "px)";
  maskCtx.fillStyle = "#fff";
  maskCtx.beginPath();
  FACE_OVAL.forEach((idx, i) => {
    const p = L[idx];
    i === 0 ? maskCtx.moveTo(p.x * w, p.y * h) : maskCtx.lineTo(p.x * w, p.y * h);
  });
  maskCtx.closePath();
  maskCtx.fill();
  maskCtx.restore();

  const faceW = Math.abs(L[454].x - L[234].x) * w;

  // 코 영역 추가 — 옆모습에서 코가 윤곽선 밖으로 나가는 문제 보완
  const nTop = L[168], nBot = L[2];
  const ncx = (nTop.x + nBot.x) / 2 * w;
  const ncy = (nTop.y + nBot.y) / 2 * h;
  const ndx = (nBot.x - nTop.x) * w;
  const ndy = (nBot.y - nTop.y) * h;
  const nLen = Math.hypot(ndx, ndy);
  const nAng = Math.atan2(ndy, ndx) - Math.PI / 2;
  maskCtx.save();
  maskCtx.filter = "blur(" + w * 0.01 + "px)";
  maskCtx.fillStyle = "#fff";
  maskCtx.beginPath();
  maskCtx.ellipse(ncx, ncy, faceW * 0.14, nLen * 0.8, nAng, 0, Math.PI * 2);
  maskCtx.fill();
  maskCtx.restore();

  maskCtx.save();
  maskCtx.globalCompositeOperation = "destination-out";
  maskCtx.filter = "blur(" + faceW * 0.02 + "px)";
  maskCtx.fillStyle = "#fff";
  carveEllipse(L[159], L[145], faceW * 0.15, faceW * 0.07, w, h);   // 왼눈
  carveEllipse(L[386], L[374], faceW * 0.15, faceW * 0.07, w, h);   // 오른눈
  carveEllipse(L[105], L[105], faceW * 0.16, faceW * 0.045, w, h);  // 왼눈썹
  carveEllipse(L[334], L[334], faceW * 0.16, faceW * 0.045, w, h);  // 오른눈썹
  carveEllipse(L[13],  L[14],  faceW * 0.22, faceW * 0.11, w, h);   // 입
  maskCtx.restore();
}

function carveEllipse(top, bottom, rx, ry, w, h) {
  const cx = (top.x + bottom.x) / 2 * w;
  const cy = (top.y + bottom.y) / 2 * h;
  maskCtx.beginPath();
  maskCtx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  maskCtx.fill();
}

// ---- 사진 찍기 (화면 플래시 포함) ----
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

function capture() {
  const a = document.createElement("a");
  a.href = out.toDataURL("image/png");
  const t = new Date();
  a.download = "film-cam_" + t.getHours() + "시" + t.getMinutes() + "분" + t.getSeconds() + "초.png";
  a.click();
}

shotBtn.addEventListener("click", async () => {
  if (useFlashEl.checked) {
    screenFlash.classList.add("on");   // 화면 전체를 흰색으로 → 얼굴을 밝힘
    await sleep(400);                   // 화면 빛이 얼굴에 닿고 카메라가 노출을 잡을 시간
    capture();
    await sleep(150);
    screenFlash.classList.remove("on");
  } else {
    capture();
  }
});
</script>
